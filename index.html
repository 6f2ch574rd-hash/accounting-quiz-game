document.getElementById('app').addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, val=el.dataset.val;
  switch(act){
    case 'go': {
      const t=val;
      if(t==='home'){ goHome(); return; }
      if(t==='calc-setup'){ S.calc={ current:null, count:0, chapter:'全部', recent:[], flipped:false }; }
      if(t==='wrongbook') S.wbPage=1;
      if(t==='explainer') S.expl.page=1;
      S.view=t; render(); return;
    }
    case 'ch': {
      const box=el.parentElement; box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      if(S.view==='calc-setup') S.calc.chapter=val;
      return;
    }
    case 'cnt': {
      const box=el.parentElement; box.querySelectorAll('[data-act=cnt]').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      const n=$('#cntN'); if(n) n.disabled = (val!=='custom');
      return;
    }
    case 'startQuiz': {
      const ch=(document.querySelector('#qCh .chip.on')||{}).dataset?.val || '全部';
      const cnt=(document.querySelector('[data-act=cnt].on')||{}).dataset?.val || 'all';
      const randomize=$('#randomize'); const wrongFirst=$('#wrongFirst');
      let list=QUESTIONS.filter(q=>q.type==='選擇');
      if(ch!=='全部') list=list.filter(q=>q.chapter===ch);
      if(wrongFirst&&wrongFirst.checked){
        const wb=wrongBook();
        const w=list.filter(q=>wb.includes(q.no));
        const o=list.filter(q=>!wb.includes(q.no));
        list=shuffle(w).concat(shuffle(o));
      } else if(randomize&&randomize.checked){ list=shuffle(list); }
      if(cnt!=='all'){
        const n = cnt==='custom' ? parseInt(($('#cntN')||{}).value||'10',10) : parseInt(cnt,10);
        list=list.slice(0, Math.max(1, Math.min(list.length, n)));
      }
      startQuiz(list); return;
    }
    case 'pick': answerChoice(el.dataset.k); return;
    case 'nextQuiz': nextQuiz(); return;
    case 'retryWrong': {
      const z=S.quiz;
      const nos=z.wrong.map(w=>z.nos[w.idx]).filter(no=>byNo(no));
      if(!nos.length){ toast('沒有錯題'); return; }
      startQuiz(nos.map(byNo)); return;
    }
    case 'share': {
      const z=S.quiz; const scored=z.answered-z.pendingCount;
      const rate = scored? Math.round(z.correct/scored*100):0;
      const txt=`會計學段考題庫｜得分 ${z.score}，正確率 ${rate}%（${z.correct}/${scored}），最高連對 ${z.maxCombo}。https://6f2ch574rd-hash.github.io/accounting-quiz-game/`;
      navigator.clipboard?.writeText(txt).then(()=>toast('成績已複製，可貼到群組'),()=>toast('複製失敗，請手動截圖'));
      return;
    }
    case 'revToggle': {
      const item=el.closest('.rev-item'); item.classList.toggle('open'); return;
    }
    case 'startStudy': {
      const ch=(document.querySelector('#qCh .chip.on')||{}).dataset?.val || '全部';
      const r=$('#randomize');
      let list=QUESTIONS.filter(q=>q.type==='簡答');
      if(ch!=='全部') list=list.filter(q=>q.chapter===ch);
      if(r&&r.checked) list=shuffle(list);
      S.study={ nos:list.map(q=>q.no), idx:0, flipped:false };
      S.view='study-play'; render(); return;
    }
    case 'flip': {
      if(S.view==='study-play'){ S.study.flipped=true; }
      else if(S.view==='calc-play'){ S.calc.flipped=true; }
      render(); return;
    }
    case 'star': {
      el.closest('.rstars').querySelectorAll('.rstar').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      const n=parseInt(el.dataset.n,10); el.closest('.rstars')._sel=n;
      return;
    }
    case 'rateSubmit': {
      const box=el.closest('.rating');
      const sel=(box.querySelector('.rstars')._sel) || Number((box.querySelector('.rstar.on')||{}).dataset?.n||0);
      if(!sel){ toast('請先點選 1～5 分'); return; }
      let q;
      if(S.view==='study-play') q=byNo(S.study.nos[S.study.idx]);
      else if(S.view==='calc-play') q=byNo(S.calc.current);
      if(q) setRating(q.no, sel);
      toast('已記錄 '+sel+' 分');
      render(); return;
    }
    case 'nextStudy': {
      S.study.idx++;
      if(S.study.idx>=S.study.nos.length){ S.view='home'; S.study=null; toast('翻卡完成'); render(); return; }
      S.study.flipped=false; render(); return;
    }
    case 'font': {
      const cur = settings().calcFont || 'm';
      const next = cur==='s' ? 'm' : (cur==='m' ? 'l' : 's');
      saveSetting('calcFont', next); render(); return;
    }
    case 'copyAns': {
      const q = byNo(S.calc.current);
      const txt = (q.chapter+' '+q.no+'\n'+q.text+'\n\n【解答】\n'+(q.answer||''));
      navigator.clipboard?.writeText(txt).then(()=>toast('已複製題目與解答'),()=>toast('複製失敗'));
      return;
    }
    case 'draw': {
      if(!S.calc) S.calc={ current:null, count:0, chapter:'全部', recent:[], flipped:false };
      if(S.calc.current){ S.calc.flipped=false; }
      doDraw(); return;
    }
    case 'wbAdd': wbAdd(el.dataset.no); return;
    case 'wbDel': wbRemove(el.dataset.no); render(); return;
    case 'copyWB': {
      const nums=wrongBook();
      const txt='我的錯題清單（會計學段考題庫）\n'+nums.map((no,i)=>{ const q=byNo(no); return (i+1)+'. '+no+' '+(q?q.chapter+' '+q.text.slice(0,40):''); }).join('\n');
      navigator.clipboard?.writeText(txt).then(()=>toast('已複製錯題清單'),()=>toast('複製失敗'));
      return;
    }
    case 'clearWB': if(confirm('確定清空錯題本？')){ lsSet('wrongbook',[]); render(); } return;
    case 'practiceWB': {
      const list=wrongBook().map(byNo).filter(q=>q&&q.type==='選擇'&&!isPending(q));
      if(!list.length){ toast('錯題本裡沒有可練習的選擇題'); return; }
      startQuiz(shuffle(list)); return;
    }
    case 'wbPage': { S.wbPage=parseInt(val,10); render(); return; }
    case 'expType': S.expl.type=val; S.expl.page=1; render(); return;
    case 'expCh': S.expl.chapter=val; S.expl.page=1; render(); return;
    case 'expFlag': S.expl.flag=val; S.expl.page=1; render(); return;
    case 'expPage': S.expl.page=parseInt(val,10); render(); return;
    case 'resume': resumeSession(); return;
    case 'discard': lsDel('session'); render(); return;
    case 'reset': {
      if(!confirm('將清除所有熟練度、錯題本、進度與最高分紀錄，確定嗎？')) return;
      ['stats','ratings','wrongbook','draws','best','session'].forEach(lsDel);
      toast('紀錄已重設'); render(); return;
    }
  }
});

document.getElementById('app').addEventListener('input', e=>{
  if(e.target.id==='expQ'){
    S.expl.q=e.target.value; S.expl.page=1;
    clearTimeout(window._expT);
    window._expT=setTimeout(()=>{
      const pos=e.target.selectionStart;
      render();
      const n=$('#expQ'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
    }, 260);
  }
});

// 鍵盤
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const k=e.key;
  if(S.view==='quiz-play'){
    const z=S.quiz; const q=byNo(z.nos[z.idx]);
    if(!z.answeredMap[q.no] && /^[1-4]$/.test(k)){
      const item=z.items[z.idx]; const key=item.keys[parseInt(k,10)-1];
      if(key) { e.preventDefault(); answerChoice(key); }
    } else if((k==='Enter'||k===' ') && z.answeredMap[q.no]){ e.preventDefault(); nextQuiz(); }
  } else if(S.view==='study-play'){
    if(k===' '){ e.preventDefault(); if(!S.study.flipped){ S.study.flipped=true; render(); } }
    else if(k==='Enter'){
      e.preventDefault();
      if(!S.study.flipped){ S.study.flipped=true; render(); return; }
      S.study.idx++;
      if(S.study.idx>=S.study.nos.length){ S.view='home'; S.study=null; toast('翻卡完成'); render(); }
      else { S.study.flipped=false; render(); }
    }
  } else if(S.view==='calc-play'){
    if(k===' '){ e.preventDefault(); S.calc.flipped=true; render(); }
    else if(k==='Enter'){ e.preventDefault(); S.calc.flipped=false; doDraw(); }
  } else if(S.view==='quiz-result'||S.view==='wrongbook'||S.view==='explainer'){
    if(k==='Escape') goHome();
  }
});

$('#btnDark').addEventListener('click',()=>{
  const on=!settings().dark; saveSetting('dark',on); applyTheme();
});
$('#btnSound').addEventListener('click',()=>{
  const on=!settings().sound; saveSetting('sound',on); applyTheme(); toast(on?'音效開啟':'音效關閉');
});
function applyTheme(){
  const s=settings();
  document.body.classList.toggle('dark', !!s.dark);
  $('#btnSound').style.opacity = s.sound?1:.45;
  $('#btnDark').textContent = s.dark?'☀':'◐';
}

// ============ 啟動 ============
applyTheme();
render();
</script>
</body>
</html>
