息5,000／利息收入5,000。","explanation":"(1)預收租金30,000／租金收入30,000；(2)利息費用8,200／應付利息8,200；(3)文具用品費用39,000／文具用品39,000；(4)保險費6,000／預付保險費6,000；(5)應收利息5,000／利息收入5,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-2；解答出處: IMG_0363.HEIC"},{"no":"3-計3","type":"計算","chapter":"第三章","source_image":"IMG_0349.HEIC","text":"3. 英明公司期末調整前有預付保險費 $40,000，預收租金 $100,000，調整後，預付保險費為 $20,000，預收租金為 $70,000。已知調整前公司淨利為 $420,000，試問調整後，公司淨利為若干？","options":{},"answer":"$430,000","explanation":"調整後公司淨利=$420,000-($40,000-$20,000)+($100,000-$70,000)=$430,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-3；解答出處: IMG_0363.HEIC"},{"no":"3-計4","type":"計算","chapter":"第三章","source_image":"IMG_0349.HEIC","text":"4. 三勝公司×1年底調整後試算表中有關預付三年的保險費為 $360,000，保險費為 $10,000，預計保險於×4年11月底到期。試問該保險於何時購入？×2年、×3年及×4年保險費用各年度金額？","options":{},"answer":"於×1年12月1日購入。×2年保險費用=$360,000÷36×12=$120,000；×3年保險費用=$360,000÷36×12=$120,000；×4年保險費用=$360,000÷36×11=$110,000。","explanation":"於×1年12月1日購入。×2年保險費用=$360,000÷36×12=$120,000；×3年保險費用=$360,000÷36×12=$120,000；×4年保險費用=$360,000÷36×11=$110,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-4；解答出處: IMG_0364.HEIC"},{"no":"3-計5","type":"計算","chapter":"第三章","source_image":"IMG_0349.HEIC","text":"5. 佳德公司從事廣告業務，×2年12月31日調整前及調整後試算表列示如下：【佳德公司試算表 ×2年12月31日】調整前借方：現金 $12,000、應收帳款 20,000、應收利息 0、廣告用品 9,600、預付保險費 4,350、運輸設備 60,000、股利 12,000、薪資費用 10,000、利息費用 350、廣告用品費用 0、租金費用 4,000；調整前貸方：應付帳款 $5,000、應付利息 0、應付票據 5,000、預收廣告收入 8,200、應付薪資 0、應付租金 0、股本 26,500、廣告收入 58,600、利息收入 29,000；合計 $132,300/$132,300。調整後借方：現金 $12,000、應收帳款 21,500、應收利息 7,000、廣告用品 6,000、預付保險費 3,500、運輸設備 60,000、股利 12,000、薪資費用 11,300、保險費用 850、利息費用 500、廣告用品費用 3,600、租金費用 11,000；調整後貸方：應付帳款 $5,000、應付利息 150、應付票據 5,000、預收廣告收入 6,600、應付薪資 1,300、應付租金 7,000、股本 26,500、廣告收入 61,700、利息收入 36,000；合計 $149,250/$149,250。試作：佳德公司本年度之調整分錄。","options":{},"answer":"調整分錄：①應收帳款1,500／廣告收入1,500；②預收廣告收入1,600／廣告收入1,600；③廣告用品費用3,600／廣告用品3,600；④保險費用850／預付保險費850；⑤利息費用150／應付利息150；⑥薪資費用1,300／應付薪資1,300；⑦應收利息7,000／利息收入7,000；⑧租金費用7,000／應付租金7,000。","explanation":"調整分錄：①應收帳款1,500／廣告收入1,500；②預收廣告收入1,600／廣告收入1,600；③廣告用品費用3,600／廣告用品3,600；④保險費用850／預付保險費850；⑤利息費用150／應付利息150；⑥薪資費用1,300／應付薪資1,300；⑦應收利息7,000／利息收入7,000；⑧租金費用7,000／應付租金7,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-5；解答出處: IMG_0364.HEIC"},{"no":"3-計6","type":"計算","chapter":"第三章","source_image":"IMG_0350.HEIC","text":"6. 三和公司於×1年底調整前試算表各科目餘額和調整資料如下，試完成調整後試算表。借方：現金 $4,042,000、應收帳款 500,000、文具用品 100,000、預付保險費 72,000、辦公設備 1,000,000、累計折舊—辦公設備 100,000；貸方：應付票據 $578,000、股本 4,000,000、股利 700,000、服務收入 2,033,000、薪資費用 205,000、水電費用 92,000。調整項目：(1) 已耗用文具用品80%。(2) 8月1日預付1年保險費 $72,000。","options":{},"answer":"借貸平衡 $6,811,000","explanation":"三和公司 調整後試算表 ×1年12月31日。借方：現金$4,042,000、應收帳款500,000、文具用品20,000、預付保險費42,000、辦公設備1,000,000、股利700,000、薪資費用205,000、水電費用92,000、保險費用30,000、文具用品費用80,000、折舊費用100,000；貸方：累計折舊—辦公設備$200,000、應付票據578,000、股本4,000,000、服務收入2,033,000。合計借方$6,811,000／貸方$6,811,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-6；解答出處: IMG_0364.HEIC"},{"no":"3-計7","type":"計算","chapter":"第三章","source_image":"IMG_0350.HEIC","text":"7. 長崎公司×6年底調整前各帳戶餘額如下：類頁1 現金 $628,000；10 應收帳款 300,000；15 文具用品 12,000；16 預付租金 80,000；18 機器設備 1,200,000；19 累計折舊 200,000；21 應付票據 200,000；23 應付帳款 300,000；25 應付薪資 $0；28 預收收入 20,000；31 股本 1,000,000；42 勞務收入 1,500,000；56 薪資費用 1,000,000；58 用品費用 0；59 租金費用 0；60 折舊費用 0。長崎公司×6年底應調整事項如下：(1) 盤點文具用品尚存 $10,000。(2) 12月份薪資 $160,000將於明年初發放。(3) 預付租金中四分之三已實現。試編製長崎公司調整後試算表。","options":{},"answer":"借貸平衡 $3,580,000","explanation":"長崎公司 調整後試算表 ×6年12月31日。借方：現金$628,000、應收帳款300,000、文具用品10,000、預付租金20,000、機器設備1,200,000、薪資費用1,160,000、用品費用2,000、租金費用60,000、折舊費用200,000；貸方：累計折舊$400,000、應付票據200,000、應付帳款300,000、應付薪資160,000、預收收入20,000、股本1,000,000、勞務收入1,500,000。合計借方$3,580,000／貸方$3,580,000。","explanation_source":"解答本","answer_source":"解答本","note":"書上題號：3-7；解答出處: IMG_0365.HEIC"},{"no":"4-問1","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"1. 結帳的意義及步驟為何？","options":{},"answer":"結帳乃指將企業在會計期間結束時，將虛帳戶的各帳戶餘額結清，實帳戶結轉下期，使各帳戶記錄暫告一個段落的會計處理程序。而其處理步驟如下所示：(1)結清虛帳戶——結清損益表帳戶時，為使收益及費用各帳戶的餘額結清歸零，將各帳戶餘額結轉至一個過渡性的彙總帳戶為「損益彙總」帳戶，也有用「本期損益」帳戶。當收入、費用帳戶餘額結轉至損益彙總帳戶後，再將損益彙總帳戶餘額結轉至權益的保留盈餘項內。最後，將股利帳戶餘額結清歸零，結轉至保留盈餘項內。(2)結轉實帳戶——結轉實帳戶乃將資產負債表內的資產、負債及權益類帳戶之餘額結轉至下期，繼續記載。","explanation":"結帳乃指將企業在會計期間結束時，將虛帳戶的各帳戶餘額結清，實帳戶結轉下期，使各帳戶記錄暫告一個段落的會計處理程序。而其處理步驟如下所示：(1)結清虛帳戶——結清損益表帳戶時，為使收益及費用各帳戶的餘額結清歸零，將各帳戶餘額結轉至一個過渡性的彙總帳戶為「損益彙總」帳戶，也有用「本期損益」帳戶。當收入、費用帳戶餘額結轉至損益彙總帳戶後，再將損益彙總帳戶餘額結轉至權益的保留盈餘項內。最後，將股利帳戶餘額結清歸零，結轉至保留盈餘項內。(2)結轉實帳戶——結轉實帳戶乃將資產負債表內的資產、負債及權益類帳戶之餘額結轉至下期，繼續記載。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0365.HEIC"},{"no":"4-問2","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"2. 何謂實帳戶及虛帳戶？兩者有何區別？","options":{},"answer":"(1)實帳戶——實帳戶乃指在會計期間終了後，資產負債表的資產、負債及權益各帳戶，並不會結清而除列。(2)虛帳戶——虛帳戶係指損益表的收益、費用及權益變動表之股利，在會計期間結束時，須結清損益表內之收入及費用各帳戶餘額歸零，本期損益歸至權益。而損益表內之收入及費用各帳戶，至下一個會計期間開始重新由零開始記錄，以累積記錄企業下一個會計期間的經營結果。權益變動表之股利也在會計期間結束時，需要結清歸零，結轉至資產負債表的權益，使得權益產生減少的變動。","explanation":"(1)實帳戶——實帳戶乃指在會計期間終了後，資產負債表的資產、負債及權益各帳戶，並不會結清而除列。(2)虛帳戶——虛帳戶係指損益表的收益、費用及權益變動表之股利，在會計期間結束時，須結清損益表內之收入及費用各帳戶餘額歸零，本期損益歸至權益。而損益表內之收入及費用各帳戶，至下一個會計期間開始重新由零開始記錄，以累積記錄企業下一個會計期間的經營結果。權益變動表之股利也在會計期間結束時，需要結清歸零，結轉至資產負債表的權益，使得權益產生減少的變動。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0365.HEIC"},{"no":"4-問3","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"3. 何謂結帳後試算表？","options":{},"answer":"結帳後試算表乃指結帳分錄登錄與過帳後，為確定結帳後分類帳中各帳戶餘額的借貸是否平衡，有必要根據結帳後分類帳餘額再編製試算表，此試算表稱為結帳後試算表。","explanation":"結帳後試算表乃指結帳分錄登錄與過帳後，為確定結帳後分類帳中各帳戶餘額的借貸是否平衡，有必要根據結帳後分類帳餘額再編製試算表，此試算表稱為結帳後試算表。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-問4","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"4. 請簡述會計循環的處理程序。","options":{},"answer":"會計的處理程序為開始於對企業交易的分析，再將交易記入日記簿，其次由日記簿過帳至分類帳後，編製試算表做調整分錄及過帳與編製調整後試算表，然後編製財務報表，最後做結帳分錄及過帳與編製結帳後試算表，週而復始每期循環一次，此為會計循環。綜合以上所述，可簡單歸納出會計循環為分錄、過帳、試算、調整、編製財務報表及結帳。前三項為平時的會計處理程序：分錄、過帳、試算；後三項為期末會計處理程序：調整、編表、結帳。","explanation":"會計的處理程序為開始於對企業交易的分析，再將交易記入日記簿，其次由日記簿過帳至分類帳後，編製試算表做調整分錄及過帳與編製調整後試算表，然後編製財務報表，最後做結帳分錄及過帳與編製結帳後試算表，週而復始每期循環一次，此為會計循環。綜合以上所述，可簡單歸納出會計循環為分錄、過帳、試算、調整、編製財務報表及結帳。前三項為平時的會計處理程序：分錄、過帳、試算；後三項為期末會計處理程序：調整、編表、結帳。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-問5","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"5. 請簡述何謂資產、負債及權益。","options":{},"answer":"資產乃指企業所擁有的經濟資源，該資源係由於過去交易事項所產生，且預期未來可產生經濟效益之流入，包括流動資產、長期投資、不動產、廠房及設備、無形資產及其他資產。負債係指企業所承擔義務，該義務未來必須以資產或新的債務償還者，包括流動負債、非流動負債及其他負債。權益係為股東對企業剩餘權益的請求權，包含股東投入資本、本期經營的損益及增資金額、減去股利。","explanation":"資產乃指企業所擁有的經濟資源，該資源係由於過去交易事項所產生，且預期未來可產生經濟效益之流入，包括流動資產、長期投資、不動產、廠房及設備、無形資產及其他資產。負債係指企業所承擔義務，該義務未來必須以資產或新的債務償還者，包括流動負債、非流動負債及其他負債。權益係為股東對企業剩餘權益的請求權，包含股東投入資本、本期經營的損益及增資金額、減去股利。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-問6","type":"簡答","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"6. 何謂營業循環？","options":{},"answer":"營業循環乃為企業營業活動由支出現金開始至收回現金為止不斷的循環過程。以買賣業為例，企業營業活動由支出現金購入商品成為存貨，再經由賒銷商品成為應收帳款，最後向客戶收回應收帳款成為現金，所需的時間為一個週期，稱為營業週期。","explanation":"營業循環乃為企業營業活動由支出現金開始至收回現金為止不斷的循環過程。以買賣業為例，企業營業活動由支出現金購入商品成為存貨，再經由賒銷商品成為應收帳款，最後向客戶收回應收帳款成為現金，所需的時間為一個週期，稱為營業週期。","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-是1","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"1. 所謂流動性係指預期變現的速度。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕正確答案為「○」。流動性（liquidity）在初級會計中通常指資產轉換為現金的難易度或速度，愈快變現者流動性愈高，故流動性係指預期變現速度的說法符合課本定義。關鍵概念：流動性＝資產變現速度。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題；書上題號：4-是非1；解答出處: IMG_0366.HEIC"},{"no":"4-是2","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"2. 營業循環也稱為營業週期。但是，營業循環不同於會計循環。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕正確答案為「○」。營業循環又稱營業週期，指企業從現金購買存貨到銷售收現的週期；會計循環則指分錄、過帳、試算、調整、編表、結帳的會計程序，兩者意義不同。關鍵概念：營業循環≠會計循環。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題；書上題號：4-是非2；解答出處: IMG_0366.HEIC"},{"no":"4-是3","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"3. 營業循環為企業營業活動由支出現金開始至收回現金止的不間斷循環過程。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕正確答案為「○」。營業循環確為企業由支出現金購貨開始，經銷售商品、收回現金，再重新購貨的不間斷循環過程，描述符合定義。關鍵概念：營業循環＝現金→存貨→銷貨→現金。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題；書上題號：4-是非3；解答出處: IMG_0366.HEIC"},{"no":"4-是4","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"4. 實帳戶乃指在會計期間終了後，資產負債表的資產、負債及權益各帳戶，並不會結清而列。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕正確答案為「○」。實帳戶指資產、負債、權益等資產負債表帳戶，期末不結清，餘額結轉下期；與之相對的收入、費用（虛帳戶）期末才結清。關鍵概念：實帳戶期末不結清、結轉下期。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題；書上題號：4-是非4；解答出處: IMG_0366.HEIC"},{"no":"4-是5","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"5. 結帳乃指將企業在會計期間結束時，將虛帳戶的各帳戶餘額結清，實帳戶結轉下期，使各帳戶記錄暫告一個段落的會計處理程序。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕正確答案為「○」。結帳的定義正是：會計期間結束時，將收入、費用等虛帳戶餘額結清至保留盈餘，實帳戶（資產、負債、權益）餘額結轉下期，使各帳戶記錄暫告段落。關鍵概念：結帳＝虛帳戶結清、實帳戶結轉。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題；書上題號：4-是非5；解答出處: IMG_0366.HEIC"},{"no":"4-選1","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"1. 會計五大要素的收入與費用為","options":{"(1)":"實帳戶","(2)":"虛帳戶","(3)":"混合帳戶","(4)":"以上皆非。"},"answer":"(2)","explanation":"〔AI 解析：解答本未印〕正確答案為(2)。收入與費用屬於損益表帳戶，期末結帳時餘額歸零、不結轉下期，故為虛帳戶；實帳戶則指資產、負債、權益。關鍵概念：損益表科目＝虛帳戶。","explanation_source":"AI 解析","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-選2","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"2. 會計人員必須將餘額結轉下期的帳戶是","options":{"(1)":"實帳戶","(2)":"虛帳戶","(3)":"實帳戶與虛帳戶","(4)":"不需任何結轉。"},"answer":"(1)","explanation":"〔AI 解析：解答本未印〕正確答案為(1)。實帳戶（資產、負債、權益）期末不結清，餘額結轉下期；虛帳戶（收入、費用）期末結帳歸零，不結轉。關鍵概念：實帳戶結轉下期，虛帳戶結清歸零。","explanation_source":"AI 解析","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-選3","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"3. 結帳分錄會使哪些帳戶之期末餘額變為零？","options":{"(1)":"收入","(2)":"資產","(3)":"權益","(4)":"以上皆是。"},"answer":"(1)","explanation":"〔AI 解析：解答本未印〕正確答案為(1)。結帳分錄將收入、費用等虛帳戶餘額結清至保留盈餘，使其期末餘額變為零；資產、權益屬實帳戶，餘額結轉下期不歸零。關鍵概念：結帳分錄使虛帳戶（收入、費用）歸零。","explanation_source":"AI 解析","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-選4","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"4. 下列項目何者為虛帳戶？","options":{"(1)":"薪資費用","(2)":"廣告費用","(3)":"銷貨收入","(4)":"預付費用。"},"answer":"(4)","explanation":"〔AI 解析：解答本未印〕解答本答案為(4)。(1)薪資費用、(2)廣告費用、(3)銷貨收入皆屬虛帳戶（期末結清歸零），(4)「預付費用」為資產類科目、屬實帳戶（結轉下期）；注意本題題面「何者為虛帳戶」若照字面解讀與解答本答案(4)似有出入，可能題面原文為「何者不為虛帳戶」或選項設計有誤，建議對照原書確認。關鍵概念：虛帳戶＝收入、費用、股利；實帳戶＝資產、負債、權益。","explanation_source":"AI 解析","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-選5","type":"選擇","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"5. 下列哪一個帳戶在期末結帳時要結清？","options":{"(1)":"應收利息","(2)":"廣告費用","(3)":"應收帳款","(4)":"預付費用。"},"answer":"(2)","explanation":"〔AI 解析：解答本未印〕正確答案為(2)。廣告費用屬費用類（虛帳戶），期末結帳時結清至保留盈餘；應收利息、應收帳款、預付費用皆屬資產（實帳戶），期末不結清、結轉下期。關鍵概念：費用類虛帳戶期末結清。","explanation_source":"AI 解析","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC"},{"no":"4-計1","type":"計算","chapter":"第四章","source_image":"IMG_0351.HEIC","text":"1. 日正國際公司×1年會計年度終了日調整後試算表資料如下：【日正國際公司調整後試算表 ×1年12月31日】借方：現金 $249,400、應收帳款 97,800、設備 259,000、股利 120,000、佣金收入 631,000、租金收入 75,000、折舊費用 40,000、薪資費用 567,000、水電費用 149,000；貸方：累計折舊—設備 $154,000、應付帳款 52,200、預收租金收入 48,000、股本 522,000；合計 $1,482,200/$1,482,200。試作：(1) 結帳分錄。(2) 結帳後試算表。","options":{},"answer":"①結清收入類帳戶：借：佣金收入 631,000、租金收入 75,000／貸：損益彙總 706,000\n②結清費用類帳戶：借：損益彙總 756,000／貸：折舊費用 40,000、薪資費用 567,000、水電費用 149,000\n③結清損益彙總：借：保留盈餘 50,000／貸：損益彙總 50,000\n④結清股利：借：保留盈餘 120,000／貸：股利 120,000","explanation":"①結清收入類帳戶：借：佣金收入 631,000、租金收入 75,000／貸：損益彙總 706,000\n②結清費用類帳戶：借：損益彙總 756,000／貸：折舊費用 40,000、薪資費用 567,000、水電費用 149,000\n③結清損益彙總：借：保留盈餘 50,000／貸：損益彙總 50,000\n④結清股利：借：保留盈餘 120,000／貸：股利 120,000","explanation_source":"解答本","answer_source":"解答本","note":"解答出處: IMG_0366.HEIC；本題「結帳後試算表」部分未拍到，仍待核對"},{"no":"4-計2","type":"計算","chapter":"第四章","source_image":"IMG_0352.HEIC","text":"2. 智勝公司在×1年底調整後試算表資料如下：借方：現金 $29,000、應收帳款 47,200、預付保險費 6,200、土地 90,000、建築物 124,000、設備 61,000、應付帳款 22,000、預收租金收入 4,500、應付票據 36,000(×1年6月到期)、股本 258,700；貸方：股利 $16,000、服務收入 89,500、租金收入 21,100、薪資費用 24,300、廣告費用 3,400、水電費用 2,700、折舊費用—建築物 8,500、折舊費用—設備 1,800、累計折舊—建築物 24,500、累計折舊—設備 3,600。試作：結帳分錄。","options":{},"answer":"[待核对]","explanation":"","explanation_source":"待核对","answer_source":"待核对","note":""},{"no":"4-計3","type":"計算","chapter":"第四章","source_image":"IMG_0352.HEIC","text":"3. 佳英貨運公司於×8年12月23日預收貨運款 $500,000，至12月底已為佳玲公司提供載運服務之運費收入為 $200,000。試作期末調整及結帳之分錄。","options":{},"answer":"[待核对]","explanation":"","explanation_source":"待核对","answer_source":"待核对","note":""},{"no":"4-計4","type":"計算","chapter":"第四章","source_image":"IMG_0352.HEIC","text":"4. 有得佳公司×9年12月31日調整後試算表如下：借方：現金 $28,600、應收帳款 75,600、應收利息 14,000、應收票據(90天到期) 224,000、文具用品 11,200、運輸設備 224,000、折舊費用 100,000、土地 98,000、薪資費用 252,000、水電費 70,000、利息費用 33,600、用品費用 36,400、廣告費 70,000；合計 $1,237,400。貸方：應付票據 $58,800、應付帳款 100,000、應付利息 16,800、應付薪資 15,400、預收收入 30,800、長期應付票據 182,000、累計折舊—運輸設備 100,000、股本 123,200、服務收入 588,000、利息收入 22,400、保留盈餘 0；合計 $1,237,400。試編製有得佳公司×9年損益表、權益變動表以及×9年12月31日之資產負債表。","options":{},"answer":"[待核对]","explanation":"","explanation_source":"待核对","answer_source":"待核对","note":""},{"no":"4-計5","type":"計算","chapter":"第四章","source_image":"IMG_0352.HEIC","text":"5. 華東公司在×1年12月31日，各帳戶餘額如下：現金 $14,550、應付帳款 21,000、應收帳款 33,000、文具用品 6,200、投資台美公司股票(長期持有) 50,000、應付票據 46,500、土地 780,000、建築物 230,000、累計折舊 6,400、股本 800,000、服務收入 44,000、保留盈餘 191,004、水電費用 3,754、薪資費用 26,400、應付票據(×4年到期) 35,000。試作：×1年12月31日分類資產負債表。","options":{},"answer":"[待核对]","explanation":"","explanation_source":"待核对","answer_source":"待核对","note":""},{"no":"4-計6","type":"計算","chapter":"第四章","source_image":"IMG_0353.HEIC","text":"6. 明德公司在×2年12月31日，各帳戶餘額如下：現金 $525,000、應收帳款 240,000、應收票據 312,000、文具用品 61,000、土地 1,400,000、建築物 800,000、累計折舊—建築物 200,000、設備 210,000、累計折舊—設備 75,000、應付帳款 43,000、應付票據 166,000、預收租金 26,500、應付票據(×5年到期) 620,000、股本 2,000,000、保留盈餘 418,100。編製×2年12月31日分類資產負債表。","options":{},"answer":"[待核对]","explanation":"","explanation_source":"待核对","answer_source":"待核对","note":"題目跨 IMG_0352/0353，續於 p90"},{"no":"5-問1","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"試說明「現金」之意義與內容。","options":{},"answer":"現金可用來支付費用、清償債務及購買資產，流動性最大，位於流動資產之首。內容包含硬幣、紙幣、銀行存款以及其他即期支票、匯票、支票等，同時現金用途不受限制。","explanation":"現金可用來支付費用、清償債務及購買資產，流動性最大，位於流動資產之首。內容包含硬幣、紙幣、銀行存款以及其他即期支票、匯票、支票等，同時現金用途不受限制。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第1題；解答出處: 解答本 p31"},{"no":"5-問2","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"何謂零用金？","options":{},"answer":"零用金乃是定額之現金，有專人保管，用以支付日常零星支出。","explanation":"零用金乃是定額之現金，有專人保管，用以支付日常零星支出。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第2題；解答出處: 解答本 p31"},{"no":"5-問3","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"說明內部控制之目的。","options":{},"answer":"為維護資產安全、確保會計資料之正確性與可靠性、提高營運效率、遵循公司政策之執行。","explanation":"為維護資產安全、確保會計資料之正確性與可靠性、提高營運效率、遵循公司政策之執行。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第3題；解答出處: 解答本 p31"},{"no":"5-問4","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"何謂現金短溢？","options":{},"answer":"零用金支付頻繁，難免收支有誤，常發生現金多出或短少情事，差額即用現金短溢科目處理。該科目若為借方餘額則作為其他費用，若為貸方餘額則作其他收入處理。","explanation":"零用金支付頻繁，難免收支有誤，常發生現金多出或短少情事，差額即用現金短溢科目處理。該科目若為借方餘額則作為其他費用，若為貸方餘額則作其他收入處理。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第4題；解答出處: 解答本 p31"},{"no":"5-問5","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"編製銀行存款調節表的目的何在？","options":{},"answer":"企業每日將收到現金存入銀行，每筆支出以支票支付，理論上現金餘額應與銀行帳上餘額相等，但事實上並不相等，故須編製銀行存款調節表，以瞭解差異發生原因及計算正確餘額。","explanation":"企業每日將收到現金存入銀行，每筆支出以支票支付，理論上現金餘額應與銀行帳上餘額相等，但事實上並不相等，故須編製銀行存款調節表，以瞭解差異發生原因及計算正確餘額。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第5題；解答出處: 解答本 p31"},{"no":"5-問6","type":"簡答","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"銀行存款調節表的意義為何？","options":{},"answer":"用以調節公司帳載餘額與銀行帳載餘額差異之報表。","explanation":"用以調節公司帳載餘額與銀行帳載餘額差異之報表。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第6題；解答出處: 解答本 p31"},{"no":"5-是1","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"以零用金支付費用，支付時，應立即在日記簿內，借記費用，貸記零用金。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"零用金採定額預付制，平時支付不做分錄，只保留單據做備忘記錄；等到補充撥款時才一次認列各項費用、貸記現金，零用金科目並不更動。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第1題；解答出處: 解答本 p31"},{"no":"5-是2","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"收到即期支票應視同現金，記入現金帳戶。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"即期支票可隨時兌現，視同現金處理，記入現金帳戶。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第2題；解答出處: 解答本 p31"},{"no":"5-是3","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"增加零用金時，應在日記簿中，借記零用金，貸記現金或銀行存款。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"零用金額度增加時，借記零用金、貸記現金（銀行存款）。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第3題；解答出處: 解答本 p31"},{"no":"5-是4","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"現金管理控制，首要在收到現金後立即記錄。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"現金最易發生錯誤與弊端，收到現金後應立即記錄，避免遺漏或挪用。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第4題；解答出處: 解答本 p31"},{"no":"5-是5","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"郵票屬於現金中之一項。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"郵票屬預付費用，不列入現金；員工借支列應收款項、遠期支票列應收票據、償債基金列長期投資。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第5題；解答出處: 解答本 p31"},{"no":"5-是6","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"在零用金撥補時，須貸記零用金。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"撥補時貸記現金，零用金科目不動；只有增減零用金額度時才更動零用金科目。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第6題；解答出處: 解答本 p31"},{"no":"5-是7","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"採用零用金制度時，以零用金支付時不必做分錄。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"平時支付僅保留單據、備忘記錄，不做正式分錄；補充時才認列費用。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第7題；解答出處: 解答本 p31"},{"no":"5-是8","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"指定用途而專戶儲存的現金是基金。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"指定用途、專戶儲存、用途受限的現金屬基金（償債基金等），不列入一般現金。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第8題；解答出處: 解答本 p31"},{"no":"5-是9","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"在會計期間結束時，零用金未及時撥補，對財務報表沒有影響。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"期末未撥補會使已發生費用未認列（費用低估），帳上零用金仍保留定額（零用金高估），財務報表受到影響。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第9題；解答出處: 解答本 p31"},{"no":"5-是10","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"所謂存款不足退票，可能是顧客開的支票被退票，也有可能是本公司開的支票被退票。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"NSF 退票指存入他人（顧客）開立之支票因對方存款不足遭退票；本公司開出之支票跳票屬透支（OD）問題，性質不同。","explanation_source":"解答本","answer_source":"解答本","note":"是非題第10題；解答出處: 解答本 p31"},{"no":"5-選1","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"在編製銀行存款調節表時，發現錯誤，應將錯誤更正在？","options":{"(1)":"公司帳上","(2)":"銀行帳上","(3)":"銀行及公司帳上","(4)":"視錯誤的種類而定"},"answer":"(4)","explanation":"錯誤發生在公司帳上就更正公司，發生在銀行帳上則由銀行更正，視錯誤種類而定。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第1題；解答出處: 解答本 p32"},{"no":"5-選2","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"有效的現金管理控制，應包括？","options":{"(1)":"現金出納及會計由同一人擔任","(2)":"避免持有過多的閒置現金","(3)":"由同一人同時掌管現金收入與支出交易","(4)":"以上皆非"},"answer":"(4)","explanation":"(1) 出納與會計同一人、(3) 同一人掌管收入與支出，皆違反職能分工。解答本答案為 (4)。〔待核对〕選項 (2)「避免持有過多閒置現金」實屬現金調度原則，建議上課再與老師確認。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第2題；解答出處: 解答本 p32"},{"no":"5-選3","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"以下何者可包含於「現金」項目中？","options":{"(1)":"償債基金中之現金","(2)":"硬幣","(3)":"郵票","(4)":"客戶遠期支票"},"answer":"(2)","explanation":"硬幣屬庫存現金；償債基金屬長期投資，郵票屬預付費用，遠期支票屬應收票據，均不屬現金。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第3題；解答出處: 解答本 p32"},{"no":"5-選4","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"在何種情況下，零用金項目須入帳？","options":{"(1)":"設置時","(2)":"增加時","(3)":"減少時","(4)":"以上皆是"},"answer":"(4)","explanation":"零用金在設置、增加、減少時均須入帳；日常零星支付才不記帳。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第4題；解答出處: 解答本 p32"},{"no":"5-選5","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"採用零用金制度時，何種情況不須做分錄？","options":{"(1)":"設立帳戶時","(2)":"實際支付時","(3)":"零用金數額增減時","(4)":"補充時"},"answer":"(2)","explanation":"設立、額度增減、補充時均須做分錄；實際支付時只保留單據，不做正式分錄。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第5題；解答出處: 解答本 p32"},{"no":"5-選6","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"如採零用金制度，期末時未補充，對財務報表之影響為何？","options":{"(1)":"費用低估，現金低估","(2)":"費用低估，零用金高估","(3)":"費用低估，零用金無誤","(4)":"費用低估，現金無誤"},"answer":"(2)","explanation":"已發生費用未認列（費用低估），帳上零用金仍保留原定額（零用金高估）。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第6題；解答出處: 解答本 p32"},{"no":"5-選7","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"在可能的狀況下，銀行存款調節表應由何人編製，才能達到最好的內部控制？","options":{"(1)":"公司出納","(2)":"處理零用金之人","(3)":"核准及簽發支票之人員","(4)":"以上皆非"},"answer":"(4)","explanation":"調節表應由保管現金及記帳以外之人員編製，始達最好內部控制；出納、零用金保管人、簽發支票人員均不適合。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第7題；解答出處: 解答本 p32"},{"no":"5-選8","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"銀行發出貸項通知，通常代表存款人之帳戶會？","options":{"(1)":"增加","(2)":"減少","(3)":"無影響","(4)":"以上皆非"},"answer":"(1)","explanation":"貸項通知單（Credit Memo）是銀行增加存款之通知，存款人帳戶增加；借項通知單才是減少。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第8題；解答出處: 解答本 p32"},{"no":"5-選9","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"銀行存款調節表編完後，下列哪一項交易不須做修正分錄？","options":{"(1)":"銀行代收票據","(2)":"銀行扣減保險箱租金","(3)":"存款不足支票","(4)":"在途存款"},"answer":"(4)","explanation":"在途存款屬銀行端時間差，銀行入帳後自然消失，公司帳上早已記錄，不須補正分錄；其餘三項均屬公司端項目，須做補正分錄。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第9題；解答出處: 解答本 p32"},{"no":"5-選10","type":"選擇","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"現金短溢如是貸方餘額，應在？","options":{"(1)":"損益表上列為費用","(2)":"損益表上列為收益","(3)":"資產負債表上列為負債","(4)":"資產負債表上列為資產"},"answer":"(2)","explanation":"現金短溢貸方餘額為盤溢收益，列損益表；借方餘額為盤短損失，才列費用。","explanation_source":"解答本","answer_source":"解答本","note":"選擇題第10題；解答出處: 解答本 p32"},{"no":"5-計1","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"日月公司有關×2年10月份零用金之交易事項：(1)10月1日提撥$500，設立零用金；(2)10/2付差旅費$200、10/5付郵資$70、10/11付雜項費用$40、10/20付文具用品$50、10/27付計程車資$120；(3)10月31日檢查零用金，手中尚存$20，當日補充。試作上列資料有關分錄。","options":{},"answer":"10/1 設立：借 零用金 500／貸 現金 500。10/2–10/27 各筆支付不做分錄。10/31 補充：借 旅費 200、郵費 70、雜項費用 40、文具用品費用 120、交通費 50／貸 現金 480。核對：支出合計 200+70+40+120+50=480，手存 500-480=$20，與題目相符，無短溢。","explanation":"10/1 設立：借 零用金 500／貸 現金 500。10/2–10/27 各筆支付不做分錄。10/31 補充：借 旅費 200、郵費 70、雜項費用 40、文具用品費用 120、交通費 50／貸 現金 480。核對：支出合計 200+70+40+120+50=480，手存 500-480=$20，與題目相符，無短溢。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第1題；解答出處: 解答本 p32-36"},{"no":"5-計2","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"玉山公司×2年7月份有關零用金交易：7/1開立支票$1,000設置零用金；7/4付郵費$80、7/8付計程車資$250、7/15付雜費$160、7/22付計程車資$260、7/29付清潔費$210；7/31檢查零用金，手存現金$45，當日補充。試根據上列資料做有關分錄。","options":{},"answer":"7/1 設立：借 零用金 1,000／貸 現金 1,000。7/4–7/29 各筆支付不做分錄。7/31 補充：借 郵費 80、交通費 510（250+260）、雜項費用 160、清潔費 210、現金短溢 5／貸 現金 955。核對：憑單合計 80+510+160+210=960；手存45，應補 1,000-45=955；960-955=$5 盤短，借記現金短溢。","explanation":"7/1 設立：借 零用金 1,000／貸 現金 1,000。7/4–7/29 各筆支付不做分錄。7/31 補充：借 郵費 80、交通費 510（250+260）、雜項費用 160、清潔費 210、現金短溢 5／貸 現金 955。核對：憑單合計 80+510+160+210=960；手存45，應補 1,000-45=955；960-955=$5 盤短，借記現金短溢。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第2題；解答出處: 解答本 p32-36"},{"no":"5-計3","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"美美公司×2年4月銀行對帳單月底結存$39,158，公司帳面結存$40,277。(1)4/30匯寄銀行$4,000，銀行尚未入帳；(2)未兌現支票#2015 $325、#2021 $1,100、#2032 $733；(3)支票#2020付文具用品$485，在現金支出簿誤記為$458；(4)託收票據面額$1,200外加利息$100，另扣除手續費$50；(5)4/10存進客戶台美商行償還欠款$500之支票，被銀行註明「存款不足」退回。試作：(1)4/30銀行存款調節表；(2)4月份必要之補正分錄。","options":{},"answer":"調節表（×2年4月30日）：公司帳簿餘額 40,277；加 託收票據 1,250（合計41,527）；減 公司支票誤記差額27、存款不足退票500（合減527）；正確餘額 $41,000。銀行對帳單餘額 39,158；加 在途存款4,000（合計43,158）；減 未兌現支票325+1,100+733=2,158；正確餘額 $41,000。補正分錄4/30：借 現金1,250、銀行服務費50、文具用品費用27、應收帳款—台美商行500；貸 應收票據1,200、利息收入100、現金27、現金500。","explanation":"調節表（×2年4月30日）：公司帳簿餘額 40,277；加 託收票據 1,250（合計41,527）；減 公司支票誤記差額27、存款不足退票500（合減527）；正確餘額 $41,000。銀行對帳單餘額 39,158；加 在途存款4,000（合計43,158）；減 未兌現支票325+1,100+733=2,158；正確餘額 $41,000。補正分錄4/30：借 現金1,250、銀行服務費50、文具用品費用27、應收帳款—台美商行500；貸 應收票據1,200、利息收入100、現金27、現金500。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第3題；解答出處: 解答本 p32-36"},{"no":"5-計4","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"南台公司×2年11月銀行對帳單帳列餘額$26,390，月底公司帳上餘額$22,180。(1)在途存款$3,140；(2)未兌現支票五張共$4,530；(3)銀行代收公司票據$3,000，扣除手續費$30；(4)銀行直接在帳戶扣除本月份保險箱租金$150。試作11月份銀行存款調節表及必要之補正分錄。","options":{},"answer":"調節表（×2年11月30日）：公司帳簿餘額 22,180；加 託收票據淨額2,970（3,000-30，合計25,150）；減 雜項費用（保險箱租金）150；正確餘額 $25,000。銀行對帳單餘額 26,390；加 在途存款3,140（合計29,530）；減 未兌現支票4,530；正確餘額 $25,000。補正分錄11/30：借 現金2,970、銀行服務費30、雜項費用150；貸 應收票據3,000、現金150。","explanation":"調節表（×2年11月30日）：公司帳簿餘額 22,180；加 託收票據淨額2,970（3,000-30，合計25,150）；減 雜項費用（保險箱租金）150；正確餘額 $25,000。銀行對帳單餘額 26,390；加 在途存款3,140（合計29,530）；減 未兌現支票4,530；正確餘額 $25,000。補正分錄11/30：借 現金2,970、銀行服務費30、雜項費用150；貸 應收票據3,000、現金150。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第4題；解答出處: 解答本 p32-36"},{"no":"5-計5","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"安美公司×2年6月份銀行往來資料：(1)6/30公司存款餘額$17,800；(2)6/30銀行對帳單餘額$21,732；(3)6月份在途存款$2,100；(4)銀行對帳單中扣除美美公司支票$518，銀行誤記為本公司開立之支票；(5)6月末未兌現支票共$6,350；(6)存款利息$200，銀行已直接記入公司存款，公司還未入帳。試作6月份銀行存款調節表及必要之分錄。","options":{},"answer":"調節表（×2年6月30日）：公司帳簿餘額 17,800；加 利息收入200；正確餘額 $18,000。銀行對帳單餘額 21,732；加 在途存款2,100、銀行誤記518（小計2,618，合計24,350）；減 未兌現支票6,350；正確餘額 $18,000。補正分錄6/30：借 現金200／貸 利息收入200。","explanation":"調節表（×2年6月30日）：公司帳簿餘額 17,800；加 利息收入200；正確餘額 $18,000。銀行對帳單餘額 21,732；加 在途存款2,100、銀行誤記518（小計2,618，合計24,350）；減 未兌現支票6,350；正確餘額 $18,000。補正分錄6/30：借 現金200／貸 利息收入200。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第5題；解答出處: 解答本 p32-36"},{"no":"5-計6","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"花蓮股份有限公司×2年度零用金相關會計事項：(1)1/5開具銀行存款支票$50,000設立零用金；(2)1/11用零用金支付水電費$15,325；(3)1/21支付旅費$7,600；(4)1/31支付文具用品費$25,000；(5)2/1補充零用金（手存現金尚存$2,000）；(6)3/1零用金額度增為$60,000。試作零用金相關之會計分錄。〔91年四等特考〕","options":{},"answer":"1/5 設立：借 零用金50,000／貸 現金（銀行存款）50,000。1/11、1/21、1/31各筆支付不做分錄。2/1 補充：借 水電費用15,325、旅費7,600、文具用品費用25,000、現金短溢75／貸 現金48,000。核對：憑單合計15,325+7,600+25,000=47,925；手存2,000，應補48,000；48,000-47,925=$75盤短，借記現金短溢。3/1 增加額度：借 零用金10,000／貸 現金10,000。","explanation":"1/5 設立：借 零用金50,000／貸 現金（銀行存款）50,000。1/11、1/21、1/31各筆支付不做分錄。2/1 補充：借 水電費用15,325、旅費7,600、文具用品費用25,000、現金短溢75／貸 現金48,000。核對：憑單合計15,325+7,600+25,000=47,925；手存2,000，應補48,000；48,000-47,925=$75盤短，借記現金短溢。3/1 增加額度：借 零用金10,000／貸 現金10,000。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第6題；解答出處: 解答本 p32-36"},{"no":"5-計7","type":"計算","chapter":"第五章","source_image":"CH5-課本p92-107/解答本p31-36","text":"君芬公司將每日所收現金全數存入銀行，所有支出均以支票支付。7月底現金帳戶顯示$12,510，7月份銀行對帳單顯示存款$12,534。另有：(1)未兌現支票在7月底尚有$3,200；(2)兩項借項通知單：銀行手續費$70、保險箱租金$100；(3)註銷支票中#313付水電費，帳單正確開出$523，記帳員誤記為$532；(4)7/31有一筆存款$3,015匯寄銀行，7月份對帳單未顯示此筆記錄。試作×2年7月份銀行存款調節表及必要之分錄。","options":{},"answer":"調節表（×2年7月31日）：公司帳上餘額 12,510；加 支票#313金額誤記差額9（532-523，小計12,519）；減 銀行服務費70、保險箱租金100（合減170）；正確餘額 $12,349。銀行對帳單餘額 12,534；加 在途存款3,015（小計15,549）；減 未兌現支票3,200；正確餘額 $12,349。補正分錄7/31：借 現金9、銀行服務費70、租金費用100；貸 水電費9、現金170。","explanation":"調節表（×2年7月31日）：公司帳上餘額 12,510；加 支票#313金額誤記差額9（532-523，小計12,519）；減 銀行服務費70、保險箱租金100（合減170）；正確餘額 $12,349。銀行對帳單餘額 12,534；加 在途存款3,015（小計15,549）；減 未兌現支票3,200；正確餘額 $12,349。補正分錄7/31：借 現金9、銀行服務費70、租金費用100；貸 水電費9、現金170。","explanation_source":"解答本","answer_source":"解答本","note":"計算題第7題；解答出處: 解答本 p32-36"},{"no":"6-問1","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"何謂現金折扣？","options":{},"answer":"賣方為了鼓勵買方早日付清貨款，所給予價格上的折扣，以致於現金收入減少，謂之「現金折扣」。就賣方而言，稱「銷貨折扣」；就買方而言，稱之「進貨折扣」。","explanation":"賣方為了鼓勵買方早日付清貨款，所給予價格上的折扣，以致於現金收入減少，謂之「現金折扣」。就賣方而言，稱「銷貨折扣」；就買方而言，稱之「進貨折扣」。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第1題；解答出處: 解答本 p37-38"},{"no":"6-問2","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"銷貨淨額在損益表上應如何表達？","options":{},"answer":"銷貨淨額是銷貨收入減去兩個抵銷科目——銷貨退回與讓價及銷貨折扣。損益表上的表達方式為：銷貨收入 $××；減：銷貨折扣 $×、銷貨退回與讓價 $×（合計 $×）；銷貨收入淨額 $××。","explanation":"銷貨淨額是銷貨收入減去兩個抵銷科目——銷貨退回與讓價及銷貨折扣。損益表上的表達方式為：銷貨收入 $××；減：銷貨折扣 $×、銷貨退回與讓價 $×（合計 $×）；銷貨收入淨額 $××。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第2題；解答出處: 解答本 p37-38"},{"no":"6-問3","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"何謂「可供出售商品總額」？","options":{},"answer":"可供出售商品總額是期初存貨加上本期進貨淨額，等於可供銷售商品總額；再減期末存貨即得銷貨成本。","explanation":"可供出售商品總額是期初存貨加上本期進貨淨額，等於可供銷售商品總額；再減期末存貨即得銷貨成本。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第3題；解答出處: 解答本 p37-38"},{"no":"6-問4","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"多站式損益表之內容，可分為哪五大類？","options":{},"answer":"銷貨收入（營業收入）、銷貨成本（營業成本）、營業費用、營業外收入與營業外費用五大類。","explanation":"銷貨收入（營業收入）、銷貨成本（營業成本）、營業費用、營業外收入與營業外費用五大類。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第4題；解答出處: 解答本 p37-38"},{"no":"6-問5","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"何謂永續盤存制與定期盤存制？兩者主要不同為何？","options":{},"answer":"定期盤存制：每一種商品均未設立存貨卡，平時對進貨交易予以記錄，銷售時不記錄存貨之減少，而待期末加以盤點，以決定期末存貨，再決定銷貨成本；就盤存時間而言稱定期盤存制，就盤存方法而言稱實地盤存制。永續盤存制：對每一種商品分別設置存貨卡，當商品發生增減變動時，隨時在存貨卡上加以記錄，因而可就帳簿記錄了解銷貨成本及期末存貨；就盤存時間而言稱永續盤存制，就盤存方法而言稱帳面盤存制。","explanation":"定期盤存制：每一種商品均未設立存貨卡，平時對進貨交易予以記錄，銷售時不記錄存貨之減少，而待期末加以盤點，以決定期末存貨，再決定銷貨成本；就盤存時間而言稱定期盤存制，就盤存方法而言稱實地盤存制。永續盤存制：對每一種商品分別設置存貨卡，當商品發生增減變動時，隨時在存貨卡上加以記錄，因而可就帳簿記錄了解銷貨成本及期末存貨；就盤存時間而言稱永續盤存制，就盤存方法而言稱帳面盤存制。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第5題；解答出處: 解答本 p37-38"},{"no":"6-問6","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"買賣業與服務業的損益表，最主要之不同為何？","options":{},"answer":"最主要不同在買賣業多了銷貨成本。服務業單純提供勞務，賺取利潤，沒有商品存貨成本，只有費用；買賣業則是買進商品、再賣出商品，賺取利潤，有兩大類費用，即銷貨成本與營業費用。","explanation":"最主要不同在買賣業多了銷貨成本。服務業單純提供勞務，賺取利潤，沒有商品存貨成本，只有費用；買賣業則是買進商品、再賣出商品，賺取利潤，有兩大類費用，即銷貨成本與營業費用。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第6題；解答出處: 解答本 p37-38"},{"no":"6-問7","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"購貨運費是否應計入購貨成本？理由為何？","options":{},"answer":"購貨運費是購貨成本的附加項目，應作為商品成本的一部分。因為在購貨之時，運費若不是賣方付，很可能賣方直接將運費加入發票價格中，還是變成商品成本。","explanation":"購貨運費是購貨成本的附加項目，應作為商品成本的一部分。因為在購貨之時，運費若不是賣方付，很可能賣方直接將運費加入發票價格中，還是變成商品成本。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第7題；解答出處: 解答本 p37-38"},{"no":"6-問8","type":"簡答","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"定期盤存制與永續盤存制會計帳務處理有何不同點？","options":{},"answer":"有兩點不同：一是在永續盤存制下，所有進貨及其加項（進貨運費）與減項（進貨折扣及進貨退出與讓價）科目，全部改成商品存貨；二是在永續盤存制下，銷貨時要多做一筆商品存貨減少之分錄（借銷貨成本、貸商品存貨）。","explanation":"有兩點不同：一是在永續盤存制下，所有進貨及其加項（進貨運費）與減項（進貨折扣及進貨退出與讓價）科目，全部改成商品存貨；二是在永續盤存制下，銷貨時要多做一筆商品存貨減少之分錄（借銷貨成本、貸商品存貨）。","explanation_source":"解答本","answer_source":"解答本","note":"問答題第8題；解答出處: 解答本 p37-38"},{"no":"6-是1","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"銷貨運費是銷貨收入之加項。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕銷貨運費是賣方為運送售出商品而支出的運費，屬銷售費用（營業費用），在損益表列於營業費用項下，不會作為銷貨收入的加項。關鍵概念：銷貨運費＝營業費用，不是銷貨收入加項。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第1題；解答出處: 解答本 p38"},{"no":"6-是2","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"進貨折扣的餘額在貸方，故在損益表中列作收益。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕進貨折扣是買方提前付款取得的折扣，屬進貨的減項；餘額雖在貸方，表達時仍列為進貨成本的減項，不是收益。關鍵概念：貸方餘額不等於收益；進貨折扣是進貨減項。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第2題；解答出處: 解答本 p38"},{"no":"6-是3","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"進貨運費是屬於進貨成本之一。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕進貨運費使商品達到可供銷售狀態，屬進貨成本的加項，計入銷貨成本。關鍵概念：進貨成本＝進貨淨額＋進貨運費。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第3題；解答出處: 解答本 p38"},{"no":"6-是4","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"現金折扣是在進貨時，如用現金購買所給予之折扣。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕現金折扣是賣方為鼓勵買方提早付款所給予的折扣，與「用現金購買」無關；立即以現金購貨並無折扣。關鍵概念：現金折扣＝提早付款的誘因，不是現金交易的折扣。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第4題；解答出處: 解答本 p38"},{"no":"6-是5","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"會計師事務所屬於買賣業的一種。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕會計師事務所以提供專業勞務取得收入，不買賣商品存貨，屬服務業。關鍵概念：有商品存貨買賣才是買賣業。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第5題；解答出處: 解答本 p38"},{"no":"6-是6","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"在定期盤存制之下，企業可隨時得知存貨成本。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕定期盤存制平時不記錄存貨減少，須待期末盤點後才能推算期末存貨與銷貨成本。關鍵概念：定期制＝期末盤點後才知道存貨與銷貨成本。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第6題；解答出處: 解答本 p38"},{"no":"6-是7","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"在永續盤存制之下，存貨不須設立存貨卡，到期末才去盤點存貨。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕正好相反；永續盤存制為每種商品設置存貨卡，商品增減時隨時記錄。關鍵概念：永續制＝逐筆設卡記錄。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第7題；解答出處: 解答本 p38"},{"no":"6-是8","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"定期盤存制在內部控制方面來說，比永續盤存制來得好。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕永續盤存制可隨時掌握存貨數量與成本，能及早發現盤盈盤虧，內部控制優於定期盤存制。關鍵概念：永續制內控較佳。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第8題；解答出處: 解答本 p38"},{"no":"6-是9","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"進貨時條件是目的地交貨，亦即是買方付運費。","options":{"○":"正確","×":"錯誤"},"answer":"×","explanation":"〔AI 解析：解答本未印〕FOB 目的地交貨，商品須運抵買方指定地點才算交付，途中運費與風險由賣方負擔。關鍵概念：目的地交貨＝賣方付運費。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第9題；解答出處: 解答本 p38"},{"no":"6-是10","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"銷貨時條件是起運點交貨，亦即是買方付運費。","options":{"○":"正確","×":"錯誤"},"answer":"○","explanation":"〔AI 解析：解答本未印〕FOB 起運點交貨，貨物離開賣方倉庫即移轉所有權，運費與途中風險歸買方。關鍵概念：起運點交貨＝買方付運費。","explanation_source":"AI 解析","answer_source":"解答本","note":"是非題第10題；解答出處: 解答本 p38"},{"no":"6-選1","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"企業採定期盤存制之會計處理，則","options":{"(1)":"買進商品時，借記「存貨」","(2)":"買進商品時，借記「商品存貨」","(3)":"買進商品時，借記「進貨」","(4)":"退回商品時，貸記「進貨」"},"answer":"(3)","explanation":"〔AI 解析：解答本未印〕定期盤存制進貨時借記「進貨」；「商品存貨」是永續盤存制的用法。退回商品時應貸記「進貨退出與讓價」，而非貸記「進貨」。關鍵概念：定期制進貨借「進貨」。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第1題；解答出處: 解答本 p38"},{"no":"6-選2","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"現銷之商品發生退回時，應做之分錄為","options":{"(1)":"貸記現金","(2)":"貸記應收帳款","(3)":"借記銷貨","(4)":"借記銷貨退回與折讓"},"answer":"(1)","explanation":"〔AI 解析：解答本未印〕現銷已收取現金，顧客退回商品時須退還現金，故貸記現金；借方記銷貨退回與讓價，以減少銷貨收入。關鍵概念：現銷退回＝貸記現金。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第2題；解答出處: 解答本 p38"},{"no":"6-選3","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"存貨的成本，應包括","options":{"(1)":"只包括進貨成本","(2)":"進貨成本加上運費","(3)":"只要與銷貨有關的費用","(4)":"所有取得並使商品達到可供銷售狀態之成本"},"answer":"(4)","explanation":"〔AI 解析：解答本未印〕存貨成本包括所有使商品達到可供銷售狀態的支出，如買價、運費等，不只是進貨價格。關鍵概念：存貨成本＝達可銷售狀態的一切必要支出。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第3題；解答出處: 解答本 p38"},{"no":"6-選4","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"若銷貨收入$720,000，銷貨成本$450,000，銷貨折扣$20,000，則銷貨毛利為","options":{"(1)":"$270,000","(2)":"$290,000","(3)":"$250,000","(4)":"以上皆非"},"answer":"(3)","explanation":"〔AI 解析：解答本未印〕銷貨收入淨額＝720,000－20,000＝700,000；銷貨毛利＝700,000－450,000＝250,000。關鍵概念：先算淨銷貨，再減銷貨成本。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第4題；解答出處: 解答本 p38"},{"no":"6-選5","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"買賣業之損益表上，營業費用不包括","options":{"(1)":"銷貨運費","(2)":"進貨運費","(3)":"保險費用","(4)":"維修費用"},"answer":"(2)","explanation":"〔AI 解析：解答本未印〕進貨運費屬進貨成本，最終列為銷貨成本，不列營業費用；銷貨運費才列銷售費用。關鍵概念：進貨運費→銷貨成本，不是營業費用。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第5題；解答出處: 解答本 p38"},{"no":"6-選6","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"明星商店買進$100,000之商品，付款條件2/10，n/30。若明星商店於折扣期限內支付貨款，則應付","options":{"(1)":"$100,000","(2)":"$80,000","(3)":"$98,000","(4)":"以上皆非"},"answer":"(3)","explanation":"〔AI 解析：解答本未印〕2/10 表示 10 天內付款可享 2% 折扣：100,000×2%＝2,000，實付 100,000－2,000＝$98,000。關鍵概念：折扣＝貨款×折扣率。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第6題；解答出處: 解答本 p38"},{"no":"6-選7","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"如期初存貨與期末存貨數量相等，則","options":{"(1)":"銷貨毛利等於營業淨利","(2)":"進貨大於銷貨數量","(3)":"進貨與銷貨數量相等","(4)":"不一定"},"answer":"(3)","explanation":"〔AI 解析：解答本未印〕期末存貨＝期初存貨＋進貨－銷貨；期初等於期末時，進貨數量必等於銷貨數量。關鍵概念：期初＝期末 ⇒ 進貨＝銷貨。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第7題；解答出處: 解答本 p38"},{"no":"6-選8","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"銷貨運費在損益表上應列入","options":{"(1)":"營業外費用","(2)":"銷售費用","(3)":"銷貨成本","(4)":"期末存貨成本"},"answer":"(2)","explanation":"〔AI 解析：解答本未印〕銷貨運費是為運送售出商品而發生，屬銷售費用（營業費用之一）。關鍵概念：銷貨運費列銷售費用。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第8題；解答出處: 解答本 p38"},{"no":"6-選9","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"A公司（買方）向B公司（賣方）買進商品，訂貨條件為目的地交貨，運費由哪一方負擔？","options":{"(1)":"買方","(2)":"賣方","(3)":"貨運公司","(4)":"以上皆非"},"answer":"(2)","explanation":"〔AI 解析：解答本未印〕FOB 目的地交貨，賣方須負責將商品運到買方指定地點，運費由賣方負擔。關鍵概念：目的地交貨＝賣方負擔運費。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第9題；解答出處: 解答本 p38"},{"no":"6-選10","type":"選擇","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"銷貨退回與折讓，帳戶之正常餘額在","options":{"(1)":"借方","(2)":"貸方","(3)":"視情況而定","(4)":"以上皆可"},"answer":"(1)","explanation":"〔AI 解析：解答本未印〕銷貨退回與讓價是銷貨收入的減項，性質上與收入相反，正常餘額在借方。關鍵概念：收入減項的正常餘額在借方。","explanation_source":"AI 解析","answer_source":"解答本","note":"選擇題第10題；解答出處: 解答本 p38"},{"no":"6-計1","type":"計算","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"利用下列資料，試求銷貨成本。期初存貨$32,000、期末存貨$45,000、銷貨收入$320,000、進貨$180,000、銷貨運費$30,000、進貨運費$25,000、銷貨退回$22,000、進貨退出$21,000、進貨折扣$12,000。","options":{},"answer":"進貨 $180,000\n減：進貨退出 $21,000、進貨折扣 $12,000　合計 $(33,000)\n進貨淨額 $147,000\n加：進貨運費 $25,000\n進貨成本淨額 $172,000\n加：期初存貨 $32,000\n可供銷售商品總額 $204,000\n減：期末存貨 $(45,000)\n銷貨成本 $159,000\n（銷貨收入、銷貨運費、銷貨退回與銷貨成本無關，不列入計算）","explanation":"進貨 $180,000\n減：進貨退出 $21,000、進貨折扣 $12,000　合計 $(33,000)\n進貨淨額 $147,000\n加：進貨運費 $25,000\n進貨成本淨額 $172,000\n加：期初存貨 $32,000\n可供銷售商品總額 $204,000\n減：期末存貨 $(45,000)\n銷貨成本 $159,000\n（銷貨收入、銷貨運費、銷貨退回與銷貨成本無關，不列入計算）","explanation_source":"解答本","answer_source":"解答本","note":"計算題第1題；解答出處: 解答本 p38-44"},{"no":"6-計2","type":"計算","chapter":"第六章","source_image":"CH6-課本p126-132/解答本p37-44","text":"山水公司×2年11月份有關商品交易事項如下：11月1日賒購商品$120,000，付款條件2/10，n/30；3日賒銷商品$60,000，付款條件2/10，n/30；4日賒購商品$30,000，付款條件1/10，n/30；5日付4日商品之運費$400；8日退回4日買進商品$5,000；11日償付1日之貨款；13日收到3日之貨款；18日出售商品$70,000，付款條件1/10，n/30；28日收到18日之貨款；30日付4日貨款。山水公司採定期盤存制。試作上述交易之分錄。","options":{},"answer":"11/1　借 進貨 120,000／貸 應付帳款 120,000\n11/3　借 應收帳款 60,000／貸 銷貨收入 60,000\n11/4　借 進貨 30,000／貸 應付帳款 30,000\n11/5　借 進貨運費 400／貸 現金 400\n11/8　借 應付帳款 5,000／貸 進貨退出及讓價 5,000\n11/11　借 應付帳款 120,000／貸 現金 117,600、進貨折扣 2,400（2%×120,000）\n11/13　借 現金 58,800、銷貨折扣 1,200／貸 應收帳款 60,000（2%×60,000）\n11/18　借 應收帳款 70,000／貸 銷貨收入 70,000\n11/28　借 現金 69,300、銷貨折扣 700／貸 應收帳款 70,000（1%×70,000）\n11/30　借 應付帳款 25,000／貸 現金 25,000（30,000－退回5,000；已逾1/10折扣期限，無折扣）"," function lsGet(k, d){ try{ const v=localStorage.getItem(K+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(K+k, JSON.stringify(v)); }catch(e){} }

const statsAll = () => lsGet('stats', {});
function markSeen(no, ok){
  const s=statsAll(); const r=s[no]||{seen:0,right:0,wrong:0};

  r.last=Date.now(); s[no]=r; lsSet('stats', s);
}

function wbRemove(no){ lsSet('wrongbook', wrongBook().filter(x=>x!==no)); }
const draws = () => lsGet('draws', {});
function addDraw(ch){ const d=draws(); d[ch]=(d[ch]||0)+1; lsSet('draws', d); }
function bestScore(){ return lsGet('best', 0); }
function todayCount(){
  const s=statsAll(); const d=new Date(); const t0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  return Object.values(s).filter(r=>r.last && r.last>=t0).length;
}

function chapterStat(ch){
  const list = QUESTIONS.filter(q=>q.chapter===ch);
  const s=statsAll(); let seen=0, right=0;
  list.forEach(q=>{ const r=s[q.no]; if(r&&r.seen){ seen++; if(r.right>0) right++; } });
  return { total:list.length, seen, right };
}
function chapterAvg(ch){
  const r=ratings(); let sum=0,n=0;
  QUESTIONS.forEach(q=>{ if(q.chapter===ch && r[q.no]!=null){ sum+=r[q.no]; n++; } });
  return n? sum/n : null;
}
function recommendChapter(){
  const rows = CHS.map(ch=>({ch, avg:chapterAvg(ch), st:chapterStat(ch)}));
  const clean = rows.filter(r=>r.avg==null && r.st.seen===0);
  if(clean.length) return clean[0].ch;
  rows.sort((a,b)=> (a.avg==null?9:a.avg) - (b.avg==null?9:b.avg) );
  return rows[0].ch;
}
function starsHtml(avg){
  if(avg==null) return '<span class="none">未評分</span>';
  const v=Math.round(avg*2)/2; let s='';
  for(let i=1;i<=5;i++){
    if(i<=Math.floor(v)) s+='<span style="color:var(--gold)">★</span>';
    else if(v>=i-0.5) s+='<span style="color:var(--gold)">☆</span>';
    else s+='<span style="color:var(--line)">☆</span>';
  }
  return s+' <span style="color:var(--ink-soft);font-size:12px">'+avg.toFixed(1)+'</span>';
}

// ============ 音效 / 震動 ============
let actx=null;
function beep(freq, dur){
  if(!settings().sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur+0.02);
  }catch(e){}
}
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function toast(msg){
  const t=$('#toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 1800);
}

function labelOf(k, q, item){
  if(isTF(q)) return k;
  const i = item && item.keys ? item.keys.indexOf(k) : -1;
  return i>=0 ? 'ABCD'[i] : String(k);
}
function feedbackText(q, a, pend, item){
  if(pend) return '<b>此題答案待核對，不計分。</b> 你的選擇已記錄。';
  const ansLabel = labelOf(q.answer, q, item);
  const pickLabel = labelOf(a.pick, q, item);
  if(a.pick===q.answer) return `<b>答對了！</b> +${a.gain} 分${a.combo>=2?'（連對 ×'+a.combo+'）':''}`;
  return `<b>答錯。</b> 正解是 <b>${esc(ansLabel)}．${esc((q.options||{})[q.answer]||'')}</b>（你選 ${esc(pickLabel)}），已自動加入錯題本。`;
}

function answerChoice(k){
  const z=S.quiz; const q=byNo(z.nos[z.idx]);
  if(z.answeredMap[q.no]) return;
  const pend=isPending(q);
  let gain=0, combo=0;
  if(!pend){
    if(k===q.answer){
      gain = 10 + (z.combo>=2 ? z.combo*2 : 0);
      z.score += gain; z.combo++; z.maxCombo=Math.max(z.maxCombo, z.combo); z.correct++;
      markSeen(q.no, true); beep(740, .12); vibrate(30);
    } else {
      z.combo = 0; markSeen(q.no, false); beep(220, .18); vibrate([40,60,40]);
      wbAddSilent(q.no);
      z.wrong.push({ idx:z.idx, no:q.no });
    }
  } else {
    z.pendingCount++; markSeen(q.no, null);
  }
  z.answered++; z.answeredMap[q.no] = { pick:k, gain, combo:z.combo };
  saveSession('測驗');
  render();
}

function wbAddSilent(no){ const a=wrongBook(); if(!a.includes(no)){ a.unshift(no); lsSet('wrongbook', a.slice(0,300)); } }

function nextQuiz(){
  const z=S.quiz; z.idx++;
  if(z.idx>=z.nos.length){ finishQuiz(); return; }
  saveSession('測驗'); render();
}

function finishQuiz(){
  const z=S.quiz;
  const best=bestScore(); if(z.score>best) lsSet('best', z.score);
  lsDel('session');
  S.view='quiz-result'; render();
}

function fmtTime(ms){
  const s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+' 分 '+(s%60)+' 秒';
}

function viewQuizResult(){
  const z=S.quiz;
  const scored = z.answered - z.pendingCount;
  const rate = scored>0 ? Math.round(z.correct/scored*100) : 0;
  const used = Date.now()-z.startedAt;
  const perQ = scored>0 ? Math.round(used/1000/scored) : 0;
  const byCh = {};
  z.items.forEach(it=>{ const q=byNo(it.no), a=z.answeredMap[q&&q.no]; if(!a||isPending(q)) return;
    byCh[q.chapter]=byCh[q.chapter]||{n:0,bad:0}; byCh[q.chapter].n++; if(a.pick!==q.answer) byCh[q.chapter].bad++; });
  const weak = Object.entries(byCh).filter(([c,v])=>v.bad>0).sort((a,b)=>b[1].bad-a[1].bad)[0];
  return `
  <button class="back" data-act="go" data-val="home">← 返回首頁</button>

    <div class="rate">正確率 ${rate}%　｜　答對 ${z.correct} / ${scored}　｜　最高連對 ${z.maxCombo}<br>

    ${weak?`<div class="m-rec" style="display:inline-block;margin-top:12px">本次較弱：<b>${weak[0]}</b>（錯 ${weak[1].bad} / ${weak[1].n} 題）</div>`:''}

      <button class="btn-ghost" data-act="retryWrong" ${z.wrong.length===0?'disabled':''}>只練錯題（${z.wrong.length}）</button>

${esc(q.explanation||'（無詳解）')}</div>

  </div>`;
}

function doDraw(){
  if(!S.calc) S.calc={ current:null, count:0, chapter:'全部', recent:[], flipped:false };
  const ch = S.calc.chapter || '全部';
  let pool = QUESTIONS.filter(q=>q.type==='計算' && !isPending(q) && (ch==='全部' || q.chapter===ch));
  if(!pool.length) pool = QUESTIONS.filter(q=>q.type==='計算' && !isPending(q));
  const seen = S.calc.recent || [];
  let cand = pool.filter(q=>seen.indexOf(q.no)<0);
  if(!cand.length){ cand = pool; S.calc.recent = []; }
  const pick = cand[Math.floor(Math.random()*cand.length)];
  if(!pick){ toast('這個範圍目前沒有可抽的計算題'); return; }
  S.calc.current = pick.no;
  S.calc.count = (S.calc.count||0) + 1;
  S.calc.recent = [pick.no].concat(S.calc.recent||[]).slice(0,12);
  S.calc.flipped = false;
  addDraw(pick.chapter);
  S.view = 'calc-play';
  render();
}

function calcPage(q){
  let n=0;
  for(const x of QUESTIONS){ if(isPending(x)) continue; if(x.type==='計算') n++; if(x.no===q.no) return n; }
  return 1;
}

// ---------- 題目排版 ----------
function qAmt(str){
  var t = String(str).trim().replace(/[，,。]$/,'');
  var am = t.match(/([$＄])?\s*((?:[(（][\d,]+[)）])|[\d][\d,]*(?:\.[\d]+)?)\s*$/);
  if(am && /\d/.test(am[2]) && t.slice(0, am.index).trim()){
    return { lab: t.slice(0, am.index).trim().replace(/[：:]$/,''), amt: (am[1]||'') + am[2] };
  }
  return { lab: t, amt: '' };
}

function qRows(list){
  var parts = String(list).split('、').map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length < 2) return null;
  return parts.map(qAmt);
}

function qListRows(tail){
  var rows = [];
  String(tail).split('；').map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(p){
    var rr = qRows(p);
    if(rr) rows = rows.concat(rr);
    else rows.push(qAmt(p));
  });
  return rows;
}

function qItemBody(body){
  var parts = String(body).split('、').map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length >= 3){
    var rows = parts.map(qAmt);
    if(rows.filter(function(r){ return r.amt; }).length >= 2) return qDatPanel(rows, '');
  }
  return esc(body);
}

function qDatPanel(rows, total){
  var inner = '';
  rows.forEach(function(r){
    inner += '<div class="st-row"><span class="st-lab">' + esc(r.lab) + '</span><span class="st-amt">' + esc(r.amt) + '</span></div>';
  });
  if(total) inner += '<div class="st-row total"><span class="st-lab">合計</span><span class="st-amt">' + esc(total) + '</span></div>';
  return '<div class="stmt">' + inner + '</div>';
}

function qSegs(raw){
  var sents = splitTop(raw, function(s, i){
    var ch = s.charAt(i);
    return ch === '。' || ch === '\n';
  }).map(function(x){ return x.trim(); }).filter(Boolean);
  var out = [];
  sents.forEach(function(seg){
    var parts = splitTop(seg, function(str, i){
      if(str.charAt(i) !== '；') return false;
      var rest = str.slice(i + 1);
      return /^\s*(?:(?:調整前|調整後)?(?:借方|貸方)|合計|總計|[(（]\d+[)）])/.test(rest);
    });
    parts.forEach(function(p){
      p = p.trim();
      if(!p) return;
      if(p.length > 120 && /[（(]/.test(p)){
        p.replace(/^（/,'').replace(/）/,'').split(/。|；|\n/).map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){ out.push(x); });
      } else {
        out.push(p);
      }
    });
  });
  return out;
}

function renderAnsText(t){
  var raw = String(t == null ? '' : t).replace(/\r/g,'').trim();
  if(!raw) return '';
  function para(txt){
    var pt = String(txt).trim().replace(/[。]+$/,'');
    if(/[：:]$/.test(pt)) return '<div class="q-p">' + esc(pt) + '</div>';
    if(/(其中|如下|下列|如下列|分別為|可分為|有下列|以下|包含|包括|如下所述)$/.test(pt.replace(/[，,、]$/,''))){
      return '<div class="q-p">' + esc(pt.replace(/[，,、]$/,'') + '：') + '</div>';
    }
    pt = pt.replace(/[，,、]$/,'');
    return '<div class="q-p">' + esc(pt + '。') + '</div>';
  }
  var parts = raw.split(/(?=[（(]\d+[）)])/).map(function(x){ return x.trim(); }).filter(Boolean);
  var html = '';
  if(parts.length >= 2 && /^[（(]\d+[）)]/.test(parts[1])){
    var lead = parts.shift().trim();
    splitTop(lead, function(str, i){ var ch = str.charAt(i); return ch === '。' || ch === '\n'; })
      .map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){ html += para(x); });
    parts.forEach(function(x){
      var m = x.match(/^[（(](\d+)[）)]\s*(.*)$/);
      html += '<div class="q-item"><span class="q-num">' + esc(m ? ('(' + m[1] + ')') : '') + '</span><span class="q-txt">' + qItemBody(m ? m[2] : x) + '</span></div>';
    });
  } else {
    splitTop(raw, function(str, i){ var ch = str.charAt(i); return ch === '。' || ch === '\n'; })
      .map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){ html += para(x); });
  }
  return '<div class="qbody">' + html + '</div>';
}

function noteGridOf(raw){
  var m = String(raw).match(/[（(]表格[：:]/);
  if(!m) return null;
  var start = m.index, depth = 0, end = -1;
  for(var i = start; i < raw.length; i++){
    var c = raw.charAt(i);
    if(c === '（' || c === '(') depth++;
    else if(c === '）' || c === ')'){
      depth--;
      if(depth === 0){ end = i; break; }
    }
  }
  if(end < 0) return null;
  var inner = raw.slice(start + 1, end).replace(/^表格[：:]/, '');
  var rows = inner.split('；').map(function(x){ return x.trim(); }).filter(Boolean);
  if(rows.length < 2) return null;
  var out = [];
  rows.forEach(function(row){
    var re = /[×X]\s?\d+\s?年?/g, pos = [], hit;
    while((hit = re.exec(row)) !== null) pos.push({ at:hit.index, len:hit[0].length, lab:hit[0].replace(/\s/g,'') });
    var label = (pos.length ? row.slice(0, pos[0].at) : row).trim();
    var cells = [];
    pos.forEach(function(pt, k){
      var nextAt = k + 1 < pos.length ? pos[k + 1].at : row.length;
      var val = row.slice(pt.at + pt.len, nextAt).replace(/、$/,'').trim();
      var ph = val.match(/^[（(](\d+)[）)]$/);
      cells.push({ per:pt.lab, ph: ph ? ph[1] : '', amt: ph ? '' : val.replace(/^[\$＄]?/,'$') });
    });
    out.push({ label:label, cells:cells });
  });
  return { rows: out, cols: out[0].cells.map(function(c){ return c.per; }), raw: raw.slice(start, end + 1) };
}
function gridHtml(g, filled, fillMap){
  var head = '<tr><th>項目</th>' + g.cols.map(function(c){ return '<th class="gc">' + esc(c) + '</th>'; }).join('') + '</tr>';
  var body = g.rows.map(function(r){
    var tds = '<td class="gl">' + esc(r.label) + '</td>';
    g.cols.forEach(function(col, i){
      var cell = r.cells[i] || { amt:'', ph:'' };
      if(filled && fillMap && cell.ph){
        var v = fillMap[cell.ph];
        tds += '<td class="gc' + (v && v.indexOf('(') === 0 ? ' neg' : '') + '">' + esc(v || cell.ph) + '</td>';
      } else if(cell.ph){
        tds += '<td class="ph">(' + esc(cell.ph) + ')</td>';
      } else {
        tds += '<td class="gc">' + esc(cell.amt) + '</td>';
      }
    });
    return '<tr>' + tds + '</tr>';
  }).join('');
  return '<div class="q-grid"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function renderQText(q){
  var raw = String((q && q.text) || '').replace(/\r/g,'').replace(/^\s*\d+\.\s*/,'').trim();
  var grid = noteGridOf(raw);
  if(grid) raw = raw.replace(grid.raw, '').trim();
  var blocks = [];

  qSegs(raw).forEach(function(seg){
    var t = seg.replace(/^[，,、]+/,'').replace(/^[）)]/,'').trim();
    if(!t) return;

    var mTitle = t.match(/^(.*?)【([^】]{1,40})】(.*)$/);
    if(mTitle){
      var head = mTitle[1].trim().replace(/[：:]$/,'');
      if(head) blocks.push({ type:'p', txt:head });
      blocks.push({ type:'cap', txt:mTitle[2] });
      t = mTitle[3].trim();
      if(!t) return;
    }

    var mSide = t.match(/^((?:調整前|調整後)?(借方|貸方))[：:](.*)$/);
    if(mSide){ blocks.push({ type:'side', label:mSide[1], txt:mSide[3] }); return; }

    var mTot = t.match(/^(合計|總計)\s*([$＄]?[\d,]+)\s*[／\/]\s*([$＄]?[\d,]+)$/);
    if(mTot){ blocks.push({ type:'tot', txt:mTot[2] + ' ／ ' + mTot[3] }); return; }

    if(/^[（(]\d+[）)]/.test(t)){
      t.split(/(?=[（(]\d+[）)])/).map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){
        blocks.push({ type:'item', txt:x });
      });
      return;
    }

    var mPre = t.match(/^([^\d（(、，；]{1,10})[（(](\d+)[）)](.*)$/);
    if(mPre && mPre[1].trim() && !/、|，/.test(mPre[1]) && !/[（(]\d+[）)]/.test(mPre[3])){
      blocks.push({ type:'cap', txt:mPre[1].trim() });
      blocks.push({ type:'item', txt:'(' + mPre[2] + ')' + mPre[3] });
      return;
    }

    var mCol = t.match(/^(.{0,46}?)[：:]\s*(.*)$/);
    if(mCol){
      var tail = mCol[2];
      var rows = qListRows(tail);
      var withAmt = rows.filter(function(r){ return r.amt; }).length;
      if(rows.length >= 2 && withAmt >= Math.min(2, rows.length)){
        var hd = mCol[1].trim();
        if(hd) blocks.push({ type: hd.length <= 14 ? 'cap' : 'p', txt:hd });
        blocks.push({ type:'dat', rows:rows });
        return;
      }
      if(/^[（(]\d+[）)]/.test(tail)){
        var hd0 = mCol[1].trim();
        if(hd0){ blocks.push({ type: hd0.length <= 14 ? 'cap' : 'p', txt:hd0 }); }
        tail.split(/(?=[（(]\d+[）)])/).map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){
          blocks.push({ type:'item', txt:x });
        });
        return;
      }
      if(/、/.test(tail) && tail.length > 40){
        var hd2 = mCol[1].trim();
        if(hd2) blocks.push({ type: hd2.length <= 14 ? 'cap' : 'p', txt:hd2 });
        blocks.push({ type:'p', txt:tail });
        return;
      }
    }

    if((t.match(/；/g)||[]).length >= 2){
      var rs = qListRows(t);
      if(rs.filter(function(r){ return r.amt; }).length >= 3){ blocks.push({ type:'dat', rows:rs }); return; }
    }
    var rows3 = qRows(t);
    if(rows3 && rows3.length >= 3){ blocks.push({ type:'dat', rows:rows3 }); return; }

    var inl = t.split(/(?=[（(]\d+[）)])/);
    if(inl.length >= 2 && /^[（(]\d+[）)]/.test(inl[1])){
      var lead = inl.shift().trim();
      if(lead) blocks.push({ type:'p', txt:lead });
      inl.forEach(function(x){ blocks.push({ type:'item', txt:x.trim() }); });
      return;
    }
    var sParts = t.split('；').map(function(x){ return x.trim(); }).filter(Boolean);
    if(sParts.length >= 3){
      var dated = sParts.filter(function(x){ return /^(?:[×X]?\d+年)?\d+月\d+日|^(?:[×X]?\d+年)?\d+日|^\d+\/\d+/.test(x); }).length;
      if(dated >= 2){
        sParts.forEach(function(x, k){
          blocks.push({ type:'p', txt:x });
        });
        return;
      }
    }
    blocks.push({ type:'p', txt:t });
  });

  var html = '';
  var i = 0;
  while(i < blocks.length){
    var b = blocks[i];
    if(b.type === 'side'){
      var grp = [];
      var variant = b.label.replace(/(借方|貸方)$/,'');
      while(i < blocks.length && blocks[i].type === 'side' && blocks[i].label.replace(/(借方|貸方)$/,'') === variant){
        grp.push(blocks[i]); i++;
      }
      var tot = '';
      if(i < blocks.length && blocks[i].type === 'tot'){ tot = blocks[i].txt; i++; }
      var cols = grp.map(function(g){
        var rr = qRows(g.txt) || qListRows(g.txt) || [{ lab:g.txt, amt:'' }];
        var inner = '<div class="st-title">' + esc(g.label) + '</div>';
        rr.forEach(function(r){
          inner += '<div class="st-row"><span class="st-lab">' + esc(r.lab) + '</span><span class="st-amt">' + esc(r.amt) + '</span></div>';
        });
        if(tot) inner += '<div class="st-row total"><span class="st-lab">合計</span><span class="st-amt">' + esc(tot) + '</span></div>';
        return '<div class="stmt">' + inner + '</div>';
      }).join('');
      html += '<div class="q-cols">' + cols + '</div>';
      continue;
    }
    if(b.type === 'item'){
      var items = '';
      var prevNum = 0;
      while(i < blocks.length && blocks[i].type === 'item'){
        var it = blocks[i];
        var m = it.txt.match(/^[（(](\d+)[）)]\s*(.*)$/);
        var num = m ? parseInt(m[1], 10) : 0;
        if(num && prevNum && num <= prevNum && items) html += '<div class="q-items">' + items + '</div>', items = '';
        var label = m ? ('(' + m[1] + ')') : '';
        var body = m ? m[2] : it.txt;
        items += '<div class="q-item"><span class="q-num">' + esc(label) + '</span><span class="q-txt">' + qItemBody(body) + '</span></div>';
        prevNum = num || prevNum;
        i++;
      }
      html += '<div class="q-items">' + items + '</div>';
      continue;
    }
    if(b.type === 'dat'){ html += qDatPanel(b.rows, ''); i++; continue; }
    if(b.type === 'tot'){ html += '<div class="q-p"><b>合計 ' + esc(b.txt) + '</b></div>'; i++; continue; }
    if(b.type === 'cap'){ html += '<div class="q-cap">' + esc(b.txt.replace(/[：:，,、]+$/, '')) + '</div>'; i++; continue; }
    var pt = b.txt.replace(/[：:，,、]+$/, '');
    if(!/[。？！?!]$/.test(pt)) pt += '。';
    html += '<div class="q-p">' + esc(pt) + '</div>';
    i++;
  }
  if(grid) html += gridHtml(grid, false, null);
  return '<div class="qbody">' + html + '</div>';
}

// ---------- 計算題解答排版 ----------
function fontLabel(){ const f=settings().calcFont||'m'; return f==='s'?'小':(f==='l'?'大':'中'); }

function ansMode(t){
  const fw = (t.match(/／/g)||[]).length;
  const aw = (t.match(/[^0-9]\s?\/\s?[^0-9]/g)||[]).length;
  const jl = /借/.test(t) && /貸/.test(t);
  const money = /[\d,]{4,}/.test(t);
  if(fw>=1 && jl) return 'journal';
  if(fw>=2) return 'journal';
  if(aw>=2 && money && !/[＝=]\s/.test(t)) return 'journal';
  if(/(損益表|資產負債表|權益變動表|試算表|調節表|進貨成本|銷貨成本)/.test(t) && !/([＝=].*){2}/.test(t)) return 'statement';
  if((t.match(/[＝=]/g)||[]).length>=2 || /÷|×/.test(t)) return 'formula';
  return 'plain';
}

function splitTop(s, isSep){
  const out=[]; let depth=0, buf='';
  for(let i=0;i<s.length;i++){
    const ch=s.charAt(i);
    if(ch==='（'||ch==='(') depth++;
    else if((ch==='）'||ch===')') && depth>0) depth--;
    if(depth===0 && isSep(s,i)){ out.push(buf); buf=''; continue; }
    buf += ch;
  }
  out.push(buf);
  return out.map(x=>x.trim()).filter(Boolean);
}
function splitSide(s){
  return splitTop(s, (str,i)=>{
    if(str.charAt(i)==='／') return true;
    if(str.charAt(i)==='/' && str.charAt(i-1)===undefined) return false;
    if(str.charAt(i)==='/'){
      const prev=str.charAt(i-1), next=str.charAt(i+1);
      return !(/\d/.test(prev) && /\d/.test(next));
    }
    if((str.charAt(i)==='；'||str.charAt(i)===';') && /^\s*[貸借]/.test(str.slice(i+1))) return true;
    return false;
  });
}

function parseItem(s){
  let t = s.trim().replace(/^、|^，/,'').replace(/[。；]$/,'');
  let note='';
  const nm = t.match(/（([^）]*)）|\(([^)]*)\)/);
  if(nm && !/^[\d,]+$/.test((nm[1]||nm[2]||'').trim())){
    note = ((nm[1]||nm[2])||'').trim();
    t = t.replace(nm[0],'');
  }
  let amt='', name=t;
  const am = t.match(/([\d,]+(?:\.[\d]+)?)(?:\s*天)?$/);
  if(am){ amt = am[1]; name = t.slice(0, am.index); }
  name = name.replace(/[\$＄]/g,'').replace(/^借[：:]?/,'').replace(/^貸[：:]?/,'')
              .replace(/[：:]$/,'').replace(/^[\s、，]+/,'').trim();
  return { name, amt, note };
}

function parseTx(s, lastDate){
  let rest = s.trim();
  let date='', num='', head='';
  const dm = rest.match(/^((?:\d{1,2}\/\d{1,2})|(?:\d{1,2}月\d{1,2}日))\s*/);
  if(dm){ date = dm[1]; rest = rest.slice(dm[0].length); }
  const nm = rest.match(/^(\(\s?\d+\s?\)|[①-⑩])\s*/);
  if(nm){ num = nm[1].replace(/\s/g,''); rest = rest.slice(nm[0].length); }
  rest = rest.replace(/^[①-⑩]\s*/,'');
  const idxMark = rest.search(/借/g);
  if(idxMark>0){
    head = rest.slice(0, idxMark).replace(/[：:]$/,'').trim();
    rest = rest.slice(idxMark);
    const hd = head.match(/(\d{1,2}\/\d{1,2})|(\d{1,2}月\d{1,2}日)/);
    if(hd && !date){ date = hd[1] || hd[2]; head = head.replace(hd[0],'').replace(/[：:，,\s]+$/,'').trim(); }
  }
  if(!date && lastDate) date = lastDate;
  const sides = splitSide(rest);
  if(sides.length<2) return null;
  const groups=[]; let cur=null;
  if(!sides.some(sd=>/^[借貸]/.test(sd))){
    const dr = sides[0].split('、').map(parseItem).filter(x=>x.name);
    const cr = sides.slice(1).join('／').split('、').map(parseItem).filter(x=>x.name);
    if(!dr.length && !cr.length) return null;
    const note = (dr.concat(cr).map(x=>x.note).filter(Boolean).join('；')) || head;
    return [{ date, num, head, dr, cr, note }];
  }
  sides.forEach(sd=>{
    const isDr = /^借/.test(sd), isCr = /^貸/.test(sd);
    if(!cur || (isDr && cur.hasCr)){ cur={dr:[],cr:[],hasCr:false}; groups.push(cur); }
    const items = sd.replace(/^[借貸][：:]?\s*/,'').split('、').map(parseItem).filter(x=>x.name);
    if(isCr){ cur.cr.push(...items); cur.hasCr=true; } else { cur.dr.push(...items); }
  });
  const out = groups.filter(g=>g.dr.length||g.cr.length).map(g=>{
    const note = (g.dr.concat(g.cr).map(x=>x.note).filter(Boolean).join('；')) || head;
    return { date, num, head, dr:g.dr, cr:g.cr, note };
  });
  return out.length? out : null;
}

function renderJournal(text){
  const segs = splitTop(text.replace(/\r/g,'').replace(/(貸[^／\/\n]{1,60}?)[／\/](?=\s*借)/g,'$1。'), (str,i)=>{
    const ch=str.charAt(i);
    if(ch==='。'||ch==='\n') return true;
    if(ch==='；' && !/^\s*[貸借]/.test(str.slice(i+1))) return true;
    return false;
  }).map(s=>s.trim().replace(/^[；。]/,'')).filter(Boolean);
  const txs=[], notes=[]; let lastDate='';
  const isTx = s => (/借/.test(s) && /貸/.test(s) && /[\d,]{2,}/.test(s)) ||  /／/.test(s) || /\s\/\s/.test(s) || /[^0-9]\s?\/\s?[^0-9]/.test(s);
  segs.forEach(seg=>{
    seg.split(/。/).forEach(raw=>{
      raw.split(/\s+\/\s*(?=[借])/).forEach(p=>{
      p = p.trim(); if(!p) return;
      if(!isTx(p)){ notes.push(p); return; }
      const list = parseTx(p, lastDate);
      if(list){ if(list[0].date) lastDate = list[0].date; list.forEach(tx=>txs.push(tx)); }
      else notes.push(p);
      });
    });
  });
  if(!txs.length) return renderPlain(text);
  let rows='';
  txs.forEach((tx,ti)=>{
    const n = Math.max(tx.dr.length,1) + tx.cr.length;
    const first = ti===0;
    let r='';
    tx.dr.forEach((it,i)=>{
      r += `<tr class="${i===0?'grp':''}">`
        + (i===0?`<td class="date" rowspan="${n}">${esc(tx.date||tx.num||'')}${tx.date&&tx.num?`<span class="no">${esc(tx.num)}</span>`:''}</td>`:'')
        + `<td class="item">${esc(it.name)}</td><td class="num">${esc(it.amt)}</td><td class="num cr"></td></tr>`;
    });
    if(!tx.dr.length){
      r += `<tr class="grp"><td class="date" rowspan="${n}">${esc(tx.date||tx.num||'')}</td><td class="item" colspan="3"></td></tr>`;
    }
    tx.cr.forEach((it,i)=>{
      r += `<tr><td class="item cr">${esc(it.name)}</td><td class="num"></td><td class="num cr">${esc(it.amt)}</td></tr>`;
    });
    if(tx.note) r += `<tr class="note"><td colspan="4">${esc(tx.note)}</td></tr>`;
    rows += r;
  });
  let html = `<div class="jr"><table><thead><tr><th class="dh">日期</th><th>會計項目</th><th class="num">借方</th><th class="num">貸方</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  if(notes.length) html += `<div class="jr-notes">${notes.map(n=>`<div>${esc(n)}</div>`).join('')}</div>`;
  return html;
}

function mkStmtRow(s, indent){
  s = s.trim();
  const am = s.match(/([\$＄])?(\([\d,]+\)|[\d,]+)(\s*天)?$/);
  let label = s, amt = '';
  if(am){ label = s.slice(0, am.index).trim(); amt = (am[2].startsWith('(') ? '' : (am[1]||'')) + am[2] + (am[3]||''); }
  let kind = 'row';
  if(!amt) kind = (/[：:]$/.test(s) || /^(借方|貸方)/.test(s)) ? 'section' : 'text';
  else if(/合計|總[額計]|淨[額利損]|餘額|平衡|小計|成本$/.test(label)) kind = 'total';
  return { indent, label, amt, kind };
}

function stmtRows(line){
  const indent = (line.match(/^ +/)||[''])[0].length;
  let s = line.trim().replace(/[。；]$/,'');
  const out = [];
  const tm = s.match(/^(.{2,44}?(?:表|損益表|資產負債表|權益變動表|試算表|調節表|平衡表)[^。；：]{0,24})：([\s\S]+)$/);
  if(tm){ out.push({indent, label:tm[1], amt:'', kind:'title'}); s = tm[2].trim(); }
  const moneyRuns = (s.match(/[\d][\d,]{2,}|[\(（][\d,]+[）\)]/g)||[]).length;
  if((s.match(/[\/／]/g)||[]).length>=1 && moneyRuns>=2){ out.push({indent, label:s, amt:'', kind:'raw'}); return out; }
  const parts = s.split('、').map(x=>x.trim()).filter(Boolean);
  const withAmt = parts.filter(p=>/([\$＄])?(\([\d,]+\)|[\d,]+)(\s*天)?$/.test(p)).length;
  if(parts.length>=2 && withAmt>=2){
    parts.forEach((p,i)=> out.push(mkStmtRow(p, indent + (i?1:0))));
  } else if(parts.length===1 && withAmt===1 && /[：:]/.test(parts[0])){
    const seg = parts[0].split(/[：:]/);
    if(seg.length===2){
      out.push({indent, label:seg[0], amt:'', kind:'section'});
      out.push(mkStmtRow(seg[1], indent+1));
    } else out.push(mkStmtRow(parts[0], indent));
  } else {
    out.push(mkStmtRow(s, indent));
  }
  return out;
}

function renderStatement(text){
  let raw = text.replace(/\r/g,'').replace(/　/g,'  ');
  let lines = raw.split(/\n|；|。/).map(l=>l.trim().replace(/[。；]$/,'')).filter(Boolean);
  let rows = [];
  lines.forEach(l=>{ rows = rows.concat(stmtRows(l)); });
  if(!rows.length) return renderPlain(text);
  const html = rows.map(r=>{
    const ind = r.indent ? ` style="padding-left:calc(${r.indent} * .85em)"` : '';
    if(r.kind==='title') return `<div class="st-title">${esc(r.label)}</div>`;
    if(r.kind==='text')  return `<div class="st-row st-section"${ind}>${esc(r.label)}</div>`;
    if(r.kind==='section') return `<div class="st-row st-section"${ind}>${esc(r.label)}</div>`;
    if(r.kind==='raw') return `<div class="st-row raw"${ind}>${esc(r.label)}</div>`;
    return `<div class="st-row ${r.kind==='total'?'total':''}"${ind}><span class="st-lab">${esc(r.label)}</span><span class="st-amt">${esc(r.amt)}</span></div>`;
  }).join('');
  const hasAmt = rows.some(r=>r.amt || r.kind==='total');
  return hasAmt ? `<div class="stmt">${html}</div>` : `<div class="calc-note">${html}</div>`;
}

function renderFormula(text){
  const lines = text.replace(/\r/g,'').split(/\n|；|。/).map(s=>s.trim().replace(/[。；]$/,'')).filter(Boolean);
  const body = lines.map(l=>{
    const isAns = /^(答案|合計|總計|營業週期)/.test(l);
    const t = esc(l).replace(/[＝=]/g, ' <b class="eq">＝</b> ');
    return `<div class="fx-l${isAns?' ans':''}">${t}</div>`;
  }).join('');
  return `<div class="fx">${body}</div>`;
}

function renderPlain(text){
  const t = text.replace(/\r/g,'').trim()
    .replace(/[；;、]\s*\n?\s*(?=[（(]\d+[）)])/g,'\n')
    .replace(/[。]\s*(?=[（(]\d+[）)])/g,'\n')
    .replace(/\s+(?=[（(]\d+[）)])/g,'\n');
  const parts = t.split(/\n/).map(s=>s.trim().replace(/^[；;、。,]+/,'').replace(/[；;、,]$/,'')).filter(Boolean);
  if(parts.length>=2){
    return `<ul class="pl-list">${parts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
  }
  return `<div class="pl-text">${esc(t)}</div>`;
}

function looksJ(c){
  if(/[借貸]方/.test(c) || /[+＋]/g.test(c)) return false;
  if(/借/.test(c) && /貸/.test(c)) return true;
  if(!/[表調節]/.test(c) && /／|\s\/\s/.test(c)){
    const lines = c.split(/；|\n/).map(x=>x.trim()).filter(Boolean);
    return lines.length>0 && lines.every(l=>(l.match(/(?<![\d])\/(?![\d])|／/g)||[]).length===1 && /[\d,]{3,}/.test(l));
  }
  return false;
}

function renderBlock(type, txt){
  if(type==='j') return renderJournal(txt);
  if(type==='f') return renderFormula(txt);
  if(type==='s') return renderStatement(txt);
  return `<div class="ans-note">${esc(txt)}</div>`;
}

function renderCalcAnswer(q, pageNo){
  const t = (q.answer||'').trim();
  const mode = ansMode(t);
  let html = '';
  if(q.no==='4-計1') html += '<div class="pend-note" style="margin-bottom:10px">部分待核對：結帳分錄已拍到解答本，但「結帳後試算表」部分未拍到。</div>';
  if(mode==='formula') html += renderFormula(t);
  else if(mode==='plain') html += renderPlain(t);
  else {
    const chunks = t.split(/。|\n/).map(x=>x.trim().replace(/[；;]$/,'')).filter(Boolean);
    const blocks = [];
    chunks.forEach(c=>{
      const isJ = looksJ(c);
      if(isJ){
        const last = blocks[blocks.length-1];
        if(last && last.type==='j') last.txt += '。' + c; else blocks.push({type:'j', txt:c});
      } else if(/^(核對|註|說明|備註|定期|永續|分批|移動平均|先進先出)/.test(c) || (/[＝=]/.test(c) && !/[\d,]{4,}/.test(c)) || (/[＝=÷×]/.test(c) && !/[借貸]/.test(c))){
        blocks.push({type:'n', txt:c});
      } else if(/[＝=÷×]/.test(c) && !/[借貸]/.test(c)){
        const last = blocks[blocks.length-1];
        if(last && last.type==='f') last.txt += '；' + c; else blocks.push({type:'f', txt:c});
      } else {
        const last = blocks[blocks.length-1];
        if(last && last.type==='s') last.txt += '；' + c; else blocks.push({type:'s', txt:c});
      }
    });
    html += blocks.map(b=>renderBlock(b.type, b.txt)).join('');
  }
  const g = noteGridOf(q.text || '');
  if(g){
    const map = {};
    (q.answer || '').replace(/[（(](\d+)[）)]\s*[\$＄]?[（(]?([\d,]+)/g, function(_, a, b){ map[a] = '$' + b; });
    if(Object.keys(map).length){
      let rest = (q.answer || '').trim();
      for(let k = 0; k < 8; k++){
        const nx = rest.replace(/^[（(]\d+[）)]\s*[\$＄]?[（(]?[\d,]+(?:[)）])?\s*[　 ]*/, '').trim();
        if(nx === rest) break;
        rest = nx;
      }
      html = '<div class="gfill-cap">填入答案後（解答本）</div>' + gridHtml(g, true, map) + (rest ? renderFormula(rest.replace(/；/g,'\n').replace(/。\s*/g,'\n')) : '');
    }
  }
  html += `<a class="pdf-link" href="會計學_計算題解答圖表.pdf" target="_blank" rel="noopener">開啟 PDF 解答（第 ${pageNo} 頁）</a>`;
  return html;
}

  function n(t){ return String(t||'').replace(/[\s\u3000，,。、；;：:（）()「」『』$＄]/g,''); }
  var x=n(a), y=n(b); return x && x===y;
}

function saveSession(label){
  if(!S.quiz) return;
  const z=S.quiz;
  lsSet('session', { label, idx:z.idx, nos:z.nos, score:z.score, combo:z.combo,
    maxCombo:z.maxCombo, correct:z.correct, answered:z.answered, pendingCount:z.pendingCount,
    wrong:z.wrong, startedAt:z.startedAt, answeredMap:z.answeredMap,
    items:z.items, ts:Date.now() });
}
function getSession(){
  const s=lsGet('session', null);
  if(!s) return null;
  if(Date.now()-s.ts > 12*3600*1000){ lsDel('session'); return null; }
  if(!s.nos || !s.nos.every(no=>byNo(no))) { lsDel('session'); return null; }
  return s;
}
function resumeSession(){
  const s=getSession(); if(!s) return;
  S.quiz = { nos:s.nos, items:s.items, idx:s.idx, score:s.score, combo:s.combo,
    maxCombo:s.maxCombo, correct:s.correct, answered:s.answered, pendingCount:s.pendingCount,
    wrong:s.wrong, startedAt:s.startedAt, answeredMap:s.answeredMap||{} };
  S.view='quiz-play'; render();
}
